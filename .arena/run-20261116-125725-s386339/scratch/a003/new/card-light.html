<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>lockup card</title>
<link rel="stylesheet" href="app.css">
<style>
  html, body { margin: 0; }
  body { background: var(--bg); min-height: 100vh; display: grid; place-items: center; }
  .card { width: 100%; padding: 28px 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="hero">
    <h1 class="hero-logo">
      <span class="hero-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <g class="mark-arrow"><path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/></g>
          <path d="M4 19h16"/>
        </svg>
      </span>
      <span class="hero-word">mdown<span class="hero-dot">.</span><span class="hero-tld">cc</span></span>
      <span class="sr-only"> — a media downloader for video and audio</span>
    </h1>
  </div>
</div>
</body>
</html>
