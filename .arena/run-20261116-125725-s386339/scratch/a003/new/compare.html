<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>compare</title>
<link rel="stylesheet" href="app.css">
<style>
  body { margin: 0; background: var(--bg); }
  .row { display: grid; grid-template-columns: 64px 1fr; align-items: center; padding: 6px 12px; }
  .lab { font: 10px var(--mono); color: #55555c; }
  .hero { width: 100%; }
  .s18 svg { stroke-width: 1.8px; }
  .s22 svg { stroke-width: 2.2px; }
  .s26 svg { stroke-width: 2.6px; }
  .s30 svg { stroke-width: 3.0px; }
</style>
</head>
<body>
<div class="row"><span class="lab">1.8</span><div class="hero s18">
    <h1 class="hero-logo">
      <span class="hero-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round">
          <g class="mark-arrow"><path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/></g>
          <path d="M4 19h16"/>
        </svg>
      </span>
      <span class="hero-word">mdown<span class="hero-dot">.</span><span class="hero-tld">cc</span></span>
    </h1>
</div></div>
