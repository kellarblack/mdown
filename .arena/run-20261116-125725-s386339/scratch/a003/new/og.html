<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mdown social card</title>
<!--
  The 1200x630 card every link preview uses. Not published: render it with

    chrome --headless --disable-gpu --hide-scrollbars --window-size=1200,630 \
      --force-device-scale-factor=1 --screenshot=assets/og-card.png tests/og-card.html

  It is a standalone page on purpose — the app itself is versioned, themed and
  connects to a server, none of which belongs in a static preview.
-->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #0a0a0b; }
  body {
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    color: #ededee; overflow: hidden;
  }
  /* one pool of light, the same gesture as the page: lit, not decorated */
  .card {
    width: 100%; height: 100%; position: relative;
    display: grid; align-content: center; justify-items: center;
    background:
      radial-gradient(720px 340px at 50% -6%, rgba(255,255,255,0.075), transparent 70%),
      #0a0a0b;
  }
  .logo { display: flex; align-items: center; gap: 20px; margin-bottom: 22px; }
  .mark svg { display: block; width: 74px; height: 74px; }
  .word { font-size: 88px; letter-spacing: -0.035em; font-weight: 500; line-height: 1; }
  .word .dot { color: #7d7d84; margin: 0 -0.06em; }
  .word .cc { color: #9a9aa1; font-weight: 400; font-size: 0.72em; margin-left: 0.06em; }

  .tagline {
    font-size: 26px; color: #a9a9b0; letter-spacing: 0.005em;
    margin: 0;
  }

  /* the foot: a hairline, the address on one side, the promise on the other */
  .foot {
    position: absolute; left: 72px; right: 72px; bottom: 64px;
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.075);
    font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #6d6d75;
  }
  .foot .right { letter-spacing: 0.08em; }
  .foot b { font-weight: 400; color: #9a9aa1; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4 19h16"/>
        </svg>
      </span>
      <span class="word">mdown<span class="dot">.</span><span class="cc">cc</span></span>
    </div>
    <p class="tagline">ad-free download tool</p>

    <div class="foot" aria-hidden="true">
      <span>paste a link<b> · </b>keep the file</span>
      <span class="right">no ads · no account · no tracking</span>
    </div>
  </div>
</body>
</html>
