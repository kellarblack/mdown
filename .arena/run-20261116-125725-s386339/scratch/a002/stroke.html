<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{
  --bg:#0a0a0b; --text:#ededee; --text-2:#a1a1a6; --text-3:#8b8b93; --accent:#ededee;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --ease: cubic-bezier(0.22,0.61,0.36,1);
}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono)}
.lab{padding:18px 20px 20px;border-bottom:1px solid rgba(255,255,255,.07);position:relative}
.tag{font-size:9.5px;color:var(--text-3);letter-spacing:.06em;margin-bottom:6px}

/* ===== the candidate block ===== */
.hero-logo{
  display:flex; align-items:baseline; justify-content:center; gap:.3em;
  margin:0; font-family:var(--mono); font-size:2.4rem; line-height:1; color:var(--text);
}
.hero-mark{flex:none; width:.76em; height:.76em}
.hero-mark svg{display:block; width:100%; height:100%; overflow:visible}
.hero-word{font-weight:500; letter-spacing:-.02em; white-space:nowrap}
.hero-word-down{display:inline-block}
.hero-word-dot{color:var(--accent); margin-right:-.06em}
.hero-word-tld{color:var(--text-3)}



.g34 .hero-logo{gap:.34em}
.deep .mark-arrow{transform:translateY(2px)}
/* guides */
.guide{position:absolute;left:0;right:0;height:1px;background:rgba(255,64,64,.45)}
</style></head>
<body>
<div class="lab"><div class="tag">stroke 1.8 &nbsp;(renders 1.75px at 38.4px type)</div><h1 class="hero-logo"><span class="hero-mark" aria-hidden="true"><svg viewBox="1 1 30 30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g class="mark-arrow"><path d="M16 2v17"/><path d="m10.5 13.5 5.5 5.5 5.5-5.5"/></g><path d="M2 20v7a3 3 0 0 0 3 3h22a3 3 0 0 0 3-3v-7"/></svg></span><span class="hero-word">m<span class="hero-word-down">down</span><span class="hero-word-dot">.</span><span class="hero-word-tld">cc</span></span></h1></div>
<div class="lab"><div class="tag">stroke 2 &nbsp;(renders 1.95px at 38.4px type)</div><h1 class="hero-logo"><span class="hero-mark" aria-hidden="true"><svg viewBox="1 1 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g class="mark-arrow"><path d="M16 2v17"/><path d="m10.5 13.5 5.5 5.5 5.5-5.5"/></g><path d="M2 20v7a3 3 0 0 0 3 3h22a3 3 0 0 0 3-3v-7"/></svg></span><span class="hero-word">m<span class="hero-word-down">down</span><span class="hero-word-dot">.</span><span class="hero-word-tld">cc</span></span></h1></div>
<div class="lab"><div class="tag">stroke 2.2 &nbsp;(renders 2.14px at 38.4px type)</div><h1 class="hero-logo"><span class="hero-mark" aria-hidden="true"><svg viewBox="1 1 30 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><g class="mark-arrow"><path d="M16 2v17"/><path d="m10.5 13.5 5.5 5.5 5.5-5.5"/></g><path d="M2 20v7a3 3 0 0 0 3 3h22a3 3 0 0 0 3-3v-7"/></svg></span><span class="hero-word">m<span class="hero-word-down">down</span><span class="hero-word-dot">.</span><span class="hero-word-tld">cc</span></span></h1></div>
</body></html>
