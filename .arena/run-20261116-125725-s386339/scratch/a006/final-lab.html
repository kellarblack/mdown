<!doctype html>
<html><head><meta charset="utf-8"><title>final tune</title>
<style>
:root{--bg:#0a0a0b;--text:#ededee;--text-2:#a1a1a6;--accent:#ededee;--ease:cubic-bezier(.22,.61,.36,1);
 --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);}
body{padding:30px 0;}
.row{padding:16px 0;border-top:1px solid #17171a;}
.tag{position:absolute;left:40px;font-size:10px;letter-spacing:.1em;color:#5b5b63;transform:translateY(26px);}
.hero-logo{display:flex;align-items:baseline;justify-content:center;gap:var(--gap,.34em);
 margin:0;font-family:var(--mono);font-size:40px;font-weight:500;letter-spacing:-.035em;line-height:1;color:var(--text);}
.hero-mark{flex:none;padding-top:.17em;color:var(--text);}
.hero-mark svg{display:block;width:calc(var(--mh,1.06em)*.83);height:var(--mh,1.06em);overflow:visible;
 fill:none;stroke:currentColor;stroke-width:var(--sw,1.1);stroke-linecap:round;stroke-linejoin:round;}
.hero-word-down{display:inline-block;}
.hero-word-dot{display:inline-block;position:relative;width:.14em;height:.3em;overflow:hidden;
 margin:0 .075em 0 .07em;color:transparent;}
.hero-word-dot::after{content:"";position:absolute;left:50%;bottom:0;width:.15em;height:.15em;
 margin-left:-.075em;border-radius:50%;background:var(--accent);}
.hero-word-sub{font-size:.8em;font-weight:500;letter-spacing:0;color:var(--text-2);}
</style></head>
<body>

<div class="row"><span class="tag">1 · 1.06em · gap .34 · stroke 1.1</span>
<h1 class="hero-logo"><span class="hero-mark" aria-hidden="true"><svg viewBox="4.2 2.2 15.6 18.8"><g><path d="M12 2.8V14"/><path d="m7.4 9.4 4.6 4.6 4.6-4.6"/></g><path d="M4.8 14.6v3.2a2.6 2.6 0 0 0 2.6 2.6h9.2a2.6 2.6 0 0 0 2.6-2.6v-3.2"/></svg></span><span class="hero-word">m<span class="hero-word-down">down</span><span class="hero-word-dot">.</span><span class="hero-word-sub">cc</span></span></h1></div>

<div class="row"><span class="tag">2 · 1.12em · gap .32 · stroke 1.15</span>
<h1 class="hero-logo" style="--mh:1.12em;--gap:.32em;--sw:1.15"><span class="hero-mark" aria-hidden="true"><svg viewBox="4.2 2.2 15.6 18.8"><g><path d="M12 2.8V14"/><path d="m7.4 9.4 4.6 4.6 4.6-4.6"/></g><path d="M4.8 14.6v3.2a2.6 2.6 0 0 0 2.6 2.6h9.2a2.6 2.6 0 0 0 2.6-2.6v-3.2"/></svg></span><span class="hero-word">m<span class="hero-word-down">down</span><span class="hero-word-dot">.</span><span class="hero-word-sub">cc</span></span></h1></div>

</body></html>
