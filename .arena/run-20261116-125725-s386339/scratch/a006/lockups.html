<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>lockup lab</title>
<style>
  :root{
    --bg:#0a0a0b; --text:#ededee; --text-2:#a1a1a6; --text-3:#8b8b93; --accent:#ededee;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  html,body{margin:0;background:var(--bg);color:var(--text);}
  body{padding:40px 24px;font-family:var(--mono);}
  .row{max-width:848px;margin:0 auto 56px;}
  .cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6a6a72;margin:0 0 6px;}

  /* ---------- shared lockup ---------- */
  .logo{
    display:flex; align-items:baseline; justify-content:center;
    gap:.36em;
    margin:0; font-family:var(--mono); font-weight:500;
    font-size:clamp(1.8rem,4.6vw,2.55rem);
    letter-spacing:-.035em; line-height:1.1;
    color:var(--text);
  }
  .mk{flex:none;padding-top:.17em;color:var(--text);}
  .mk svg{display:block;overflow:visible;height:1em;width:.893em;fill:none;
    stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;}
  .w{white-space:nowrap;}
  .w > span{display:inline-block;}
  .dot{color:var(--accent);margin-left:-.17em;margin-right:-.09em;}
  .tld{font-size:.78em;font-weight:500;color:var(--text-2);letter-spacing:0;margin-left:-.04em;}

  /* variant knobs */
  [data-v="2"] .mk{transform:translateY(.06em);}
  [data-v="3"] .mk svg{height:1.12em;width:1em;}
  [data-v="5"] .tld{font-size:1em;}
  [data-v="6"] .tld{font-size:.72em;color:var(--text-3);}
  .big{font-size:140px;}
  .big .wk{transform:none;}

  /* the old one, for reference */
  .old-logo{display:flex;align-items:center;justify-content:center;gap:14px;margin:0;}
  .old-mark{display:grid;place-items:center;flex:none;width:44px;height:44px;}
  .old-mark svg{width:100%;height:100%;}
  .old-word{font-family:var(--mono);font-weight:500;font-size:2.4rem;letter-spacing:-.03em;line-height:1;}
  .old-word-dot{color:var(--accent);margin:0 -.14em;}
  .old-word-sub{font-size:.72em;font-weight:400;color:var(--text-3);letter-spacing:0;margin-left:2px;}
</style>
</head>
<body>

<div class="row">
  <p class="cap">v0 — today</p>
  <h1 class="old-logo">
    <span class="old-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4 19h16"/>
      </svg>
    </span>
    <span class="old-word"><span>m<span>down</span><span class="old-word-dot">.</span><span class="old-word-sub">cc</span></span></span>
  </h1>
</div>

<div class="row" data-v="1">
  <p class="cap">v1 — tray on the baseline</p>
  <h1 class="logo">
    <span class="mk" aria-hidden="true">
      <svg viewBox="3.4 2.4 17.2 19.2" aria-hidden="true">
        <g class="ar"><path d="M12 3.6V12.2"/><path d="m7.9 8.2 4.1 4 4.1-4"/></g>
        <path d="M4.6 14v3.9a2.5 2.5 0 0 0 2.5 2.5h9.8a2.5 2.5 0 0 0 2.5-2.5V14"/>
      </svg>
    </span>
    <span class="w"><span>m</span><span class="dw">down</span><span class="dot">.</span><span class="tld">cc</span></span>
  </h1>
</div>

<div class="row" data-v="2">
  <p class="cap">v2 — same, mark nudged up .06em</p>
  <h1 class="logo">
    <span class="mk" aria-hidden="true">
      <svg viewBox="3.4 2.4 17.2 19.2">
        <g class="ar"><path d="M12 3.6V12.2"/><path d="m7.9 8.2 4.1 4 4.1-4"/></g>
        <path d="M4.6 14v3.9a2.5 2.5 0 0 0 2.5 2.5h9.8a2.5 2.5 0 0 0 2.5-2.5V14"/>
      </svg>
    </span>
    <span class="w"><span>m</span><span class="dw">down</span><span class="dot">.</span><span class="tld">cc</span></span>
  </h1>
</div>

<div class="row" data-v="3">
  <p class="cap">v3 — mark 1.12em, tray on baseline</p>
  <h1 class="logo">
    <span class="mk" aria-hidden="true">
      <svg viewBox="3.4 2.4 17.2 19.2">
        <g class="ar"><path d="M12 3.6V12.2"/><path d="m7.9 8.2 4.1 4 4.1-4"/></g>
        <path d="M4.6 14v3.9a2.5 2.5 0 0 0 2.5 2.5h9.8a2.5 2.5 0 0 0 2.5-2.5V14"/>
      </svg>
    </span>
    <span class="w"><span>m</span><span class="dw">down</span><span class="dot">.</span><span class="tld">cc</span></span>
  </h1>
</div>

<div class="row" data-v="5">
  <p class="cap">v5 — cc at full size, --text-2</p>
  <h1 class="logo">
    <span class="mk" aria-hidden="true">
      <svg viewBox="3.4 2.4 17.2 19.2">
        <g class="ar"><path d="M12 3.6V12.2"/><path d="m7.9 8.2 4.1 4 4.1-4"/></g>
        <path d="M4.6 14v3.9a2.5 2.5 0 0 0 2.5 2.5h9.8a2.5 2.5 0 0 0 2.5-2.5V14"/>
      </svg>
    </span>
    <span class="w"><span>m</span><span class="dw">down</span><span class="dot">.</span><span class="tld">cc</span></span>
  </h1>
</div>

<div class="row">
  <p class="cap">v1 at 140px — inspect the drawing</p>
  <h1 class="logo big">
    <span class="mk" aria-hidden="true">
      <svg viewBox="3.4 2.4 17.2 19.2">
        <g class="ar"><path d="M12 3.6V12.2"/><path d="m7.9 8.2 4.1 4 4.1-4"/></g>
        <path d="M4.6 14v3.9a2.5 2.5 0 0 0 2.5 2.5h9.8a2.5 2.5 0 0 0 2.5-2.5V14"/>
      </svg>
    </span>
    <span class="w"><span>m</span><span class="dw">down</span><span class="dot">.</span><span class="tld">cc</span></span>
  </h1>
</div>

<div class="row">
  <p class="cap">mark alone, 200px</p>
  <div style="display:flex;align-items:flex-end;gap:60px;padding:40px 0;border-bottom:1px solid #222">
    <svg style="height:200px;width:178px;overflow:visible;fill:none;stroke:var(--text);stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round" viewBox="3.4 2.4 17.2 19.2">
      <g><path d="M12 3.6V12.2"/><path d="m7.9 8.2 4.1 4 4.1-4"/></g>
      <path d="M4.6 14v3.9a2.5 2.5 0 0 0 2.5 2.5h9.8a2.5 2.5 0 0 0 2.5-2.5V14"/>
    </svg>
    <svg style="height:200px;width:200px;overflow:visible;fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24">
      <g><path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/></g>
      <path d="M4 19h16"/>
    </svg>
  </div>
</div>

</body>
</html>
