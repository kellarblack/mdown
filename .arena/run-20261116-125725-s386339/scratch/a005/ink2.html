<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="out"></pre>
<script>
const c=document.createElement("canvas").getContext("2d");
c.font='500 1000px ui-monospace, "SF Mono", Menlo';
const g=ch=>{const m=c.measureText(ch);return {capAbove:+((m.actualBoundingBoxAscent)/1000).toFixed(4), L:+(m.actualBoundingBoxLeft/-1000).toFixed(4), R:+(m.actualBoundingBoxRight/1000).toFixed(4)}};
document.getElementById("out").textContent=JSON.stringify({d:g("d"),m:g("m"),M:g("M"),x:g("x")});
</script></body></html>
