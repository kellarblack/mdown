<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hero lockup preview</title>
<style>
:root {
  --bg: #0a0a0b; --bg-elev: #101012;
  --stroke: rgba(255,255,255,0.09);
  --text: #ededee; --text-2: #a1a1a6; --text-3: #8b8b93;
  --accent: #ededee;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.55 -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { width: 100%; max-width: 900px; margin: 0 auto; padding: 40px clamp(16px, 4vw, 26px); }
.hero { width: 100%; }
.sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0 }

/* stand-in composer, only to judge the lockup in place */
.fake-composer { height: 64px; border: 1px solid var(--stroke); border-radius: 12px; background: var(--bg-elev); margin-top: 6px; }
.tag { font: 0.62rem/1 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-3); margin: 34px 0 8px; }

/* ---------- OLD (baseline) ---------- */
.old-hero-logo { display:flex; align-items:center; justify-content:center; gap:14px; margin:0 auto 10px; color:var(--text); }
.old-hero-mark { display:grid; place-items:center; flex:none; width:clamp(34px,5vw,44px); height:clamp(34px,5vw,44px); color:var(--text); }
.old-hero-mark svg { width:100%; height:100%; }
.old-word { font-family:var(--mono); font-weight:500; font-size:clamp(1.75rem,4.2vw,2.4rem); letter-spacing:-0.03em; line-height:1; }
.old-word .dot { color:var(--accent); margin:0 -0.14em; }
.old-word .sub { font-size:0.72em; font-weight:400; color:var(--text-3); letter-spacing:0; margin-left:2px; }

/* ---------- NEW (candidate) ---------- */
.hero-logo {
  --mark-h: 0.7em;          /* the mark's ink is exactly one cap height */
  --mark-gap: 0.2em;
  display: flex; align-items: baseline; justify-content: center;
  gap: var(--mark-gap);
  margin: 0 auto;
  font-family: var(--mono);
  font-size: clamp(1.75rem, 4.2vw, 2.4rem);
  line-height: 1;
  color: var(--text);
  white-space: nowrap;
}
.hero-mark { flex: none; display: block; width: var(--mark-h); height: var(--mark-h); color: var(--text); overflow: visible; }
.hero-mark svg { display: block; width: 100%; height: 100%; }
.hero-word { font-weight: 500; letter-spacing: -0.012em; }
.hero-word-m { display: inline; }
.hero-word-down { display: inline-block; }
.hero-word-dot { color: var(--accent); margin: 0 -0.055em 0 -0.01em; }
.hero-word-sub { color: var(--text-2); }
</style>
</head>
<body>
<div class="wrap">

  <div class="tag">old — 1440</div>
  <div class="hero">
    <h1 class="old-hero-logo">
      <span class="old-hero-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4 19h16"/>
        </svg>
      </span>
      <span class="old-word"><span>m</span><span>down</span><span class="dot">.</span><span class="sub">cc</span></span>
    </h1>
    <div class="fake-composer"></div>
  </div>

  <div class="tag">new — 1440</div>
  <div class="hero">
    <h1 class="hero-logo">
      <span class="hero-mark" id="m1" aria-hidden="true">
        <svg viewBox="3 3 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <g class="mark-arrow"><path d="M10 3.75v8.3"/><path d="M6.4 9.9 10 13.5 13.6 9.9"/></g>
          <path class="mark-tray" d="M3.75 13.9v2.35h12.5v-2.35"/>
        </svg>
      </span>
      <span class="hero-word"><span class="hero-word-m">m</span><span class="hero-word-down">down</span><span class="hero-word-dot">.</span><span class="hero-word-sub">cc</span></span>
      <span class="sr-only"> — a media downloader for video and audio</span>
    </h1>
    <div class="fake-composer"></div>
  </div>

  <div class="tag">new, stroke 1.4 — 1440</div>
  <div class="hero">
    <h1 class="hero-logo">
      <span class="hero-mark" id="m2" aria-hidden="true">
        <svg viewBox="3 3 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3.75v8.3"/><path d="M6.4 9.9 10 13.5 13.6 9.9"/><path d="M3.75 13.9v2.35h12.5v-2.35"/>
        </svg>
      </span>
      <span class="hero-word"><span>m</span><span>down</span><span class="hero-word-dot">.</span><span class="hero-word-sub">cc</span></span>
    </h1>
  </div>

  <div class="tag">new at 28px, stroke 1.5</div>
  <div class="hero" style="font-size:28px">
    <h1 class="hero-logo" style="font-size:28px">
      <span class="hero-mark" id="m3" aria-hidden="true">
        <svg viewBox="3 3 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3.75v8.3"/><path d="M6.4 9.9 10 13.5 13.6 9.9"/><path d="M3.75 13.9v2.35h12.5v-2.35"/>
        </svg>
      </span>
      <span class="hero-word"><span>m</span><span>down</span><span class="hero-word-dot">.</span><span class="hero-word-sub">cc</span></span>
    </h1>
  </div>

  <div class="tag">new at 41.6px (2.6rem), fixed size</div>
  <div class="hero">
    <h1 class="hero-logo" style="font-size:41.6px">
      <span class="hero-mark" aria-hidden="true" id="m4">
        <svg viewBox="3 3 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3.75v8.3"/><path d="M6.4 9.9 10 13.5 13.6 9.9"/><path d="M3.75 13.9v2.35h12.5v-2.35"/>
        </svg>
      </span>
      <span class="hero-word"><span>m</span><span>down</span><span class="hero-word-dot">.</span><span class="hero-word-sub">cc</span></span>
    </h1>
  </div>

  <pre id="metrics" style="font:11px/1.5 var(--mono); color:var(--text-3); margin-top:40px"></pre>
</div>
<script>
const out = [];
function metrics() {
  const word = document.querySelectorAll(".hero-logo .hero-word")[0];
  const mark = document.getElementById("m1");
  const fs = parseFloat(getComputedStyle(word).fontSize);
  const c = document.createElement("canvas").getContext("2d");
  c.font = `500 ${fs}px ui-monospace, "SF Mono", Menlo`;
  const cap = c.measureText("M");
  const fb = c.measureText("m");
  const asc = fb.fontBoundingBoxAscent, desc = fb.fontBoundingBoxDescent;
  const baselineFromTop = (1 - (asc + desc) / fs) / 2 * fs + asc; // line-height:1
  out.push(`font-size ${fs.toFixed(2)}px`);
  out.push(`capHeight(actual) ${cap.actualBoundingBoxAscent.toFixed(2)}px = ${(cap.actualBoundingBoxAscent/fs).toFixed(4)}em`);
  out.push(`fontBox asc ${asc.toFixed(2)} desc ${desc.toFixed(2)} -> baseline ${baselineFromTop.toFixed(2)}px from box top (${(baselineFromTop/fs).toFixed(4)}em)`);
  const wr = word.getBoundingClientRect(), mr = mark.getBoundingClientRect();
  out.push(`word rect ${wr.width.toFixed(1)}x${wr.height.toFixed(1)} top ${wr.top.toFixed(1)} bottom ${wr.bottom.toFixed(1)}`);
  out.push(`mark rect ${mr.width.toFixed(1)}x${mr.height.toFixed(1)} top ${mr.top.toFixed(1)} bottom ${mr.bottom.toFixed(1)}`);
  out.push(`mark ink bottom vs word baseline: ${(wr.top + baselineFromTop - mr.bottom).toFixed(2)}px (0 = perfect)`);
  out.push(`mark ink top vs cap top: ${(mr.top - (wr.top + baselineFromTop - cap.actualBoundingBoxAscent)).toFixed(2)}px (0 = perfect)`);
  out.push(`render stroke ${(1.5/14*parseFloat(getComputedStyle(mark).width)).toFixed(2)}px`);
  out.push(`lockup width ${(mr.width + parseFloat(getComputedStyle(document.querySelectorAll(".hero-logo")[0]).gap) + wr.width).toFixed(1)}px`);
  document.getElementById("metrics").textContent = out.join("\n");
}
document.fonts.ready.then(metrics);
</script>
</body>
</html>
