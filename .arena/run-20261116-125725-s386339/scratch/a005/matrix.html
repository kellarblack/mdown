<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>matrix</title>
<style>
:root { --bg:#0a0a0b; --text:#ededee; --text-2:#a1a1a6; --text-3:#8b8b93; --accent:#ededee;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); }
.row { padding: 14px 20px; border-bottom: 1px solid #17171a; }
.row .lab { font: 9px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:#5a5a61; margin-bottom: 12px; }
.lock { display:flex; align-items:baseline; justify-content:center; gap:.2em; margin:0;
        font-family:var(--mono); font-size:38.4px; line-height:1; color:var(--text); white-space:nowrap; }
.lock.sm { font-size: 28px; }
.lock .m { flex:none; display:block; width:.7em; height:.7em; overflow:visible; }
.lock .m svg { display:block; width:100%; height:100%; }
.lock .w { font-weight:500; letter-spacing:-0.012em; }
.lock .dot { color:var(--accent); }
.lock .sub { color:var(--text-2); }
/* dot variants */
.d-a .dot { margin:0 -0.2em; }
.d-a .sub { font-size:1em; }
.d-b .dot { margin:0 -0.14em 0 -0.02em; }
.d-b .sub { font-size:0.86em; }
.d-c .dot { margin:0 -0.1em; }
.d-c .sub { font-size:0.8em; color:var(--text-3); }
.d-d .dot { margin:0 -0.12em 0 -0.02em; }
.d-d .sub { font-size:1em; color:var(--text-3); }
.d-e .dot { margin:0 -0.17em 0 -0.03em; }
.d-e .sub { font-size:0.92em; color:var(--text-2); }
</style>
</head>
<body>
<script>
const marks = {
  v1: '<path d="M10 3.75v8.3"/><path d="M6.4 9.9 10 13.5 13.6 9.9"/><path d="M3.75 16.25h12.5"/>',
  v2: '<path d="M10 3.75v8.3"/><path d="M6.4 9.9 10 13.5 13.6 9.9"/><path d="M4.8 16.25h10.4"/>',
  v3: '<path d="M10 3.75v8.3"/><path d="M6.4 9.9 10 13.5 13.6 9.9"/><path d="M3.75 13.9v2.35h12.5v-2.35"/>',
  v4: '<path d="M10 3.9 13.4 7.3 10 10.7 6.6 7.3z" transform="translate(0 0)"/><path d="M3.75 16.25h12.5"/>',
  v5: '<path d="M10 3.75v6.9"/><path d="M6.6 8.35 10 11.75 13.4 8.35"/><path d="M3.75 16.25h12.5"/>',
};
function svg(inner, sw = 1.5) {
  return `<svg viewBox="3 3 14 14" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}
const rows = [
  ["mark v1 — flat tray, round caps, 12.5 wide", "v1", "d-a", 1.5],
  ["mark v2 — flat tray, 10.4 wide (1.44x head)", "v2", "d-a", 1.5],
  ["mark v3 — tray with 2.35 walls", "v3", "d-a", 1.5],
  ["mark v5 — shorter arrow (tip at 11.75)", "v5", "d-a", 1.5],
  ["dot A — dot -0.2em both sides, cc 1em text-2", "v2", "d-a", 1.5],
  ["dot B — dot -0.14/-0.02, cc .86em text-2", "v2", "d-b", 1.5],
  ["dot C — dot -0.1, cc .8em text-3", "v2", "d-c", 1.5],
  ["dot D — dot -0.12/-0.02, cc 1em text-3", "v2", "d-d", 1.5],
  ["dot E — dot -0.17/-0.03, cc .92em text-2", "v2", "d-e", 1.5],
  ["mark v2 stroke 1.3", "v2", "d-a", 1.3],
  ["mark v2 stroke 1.7", "v2", "d-a", 1.7],
];
document.write(rows.map(([lab, mk, dot, sw]) => `
  <div class="row"><div class="lab">${lab}</div>
  <h1 class="lock ${dot}"><span class="m">${svg(marks[mk], sw)}</span><span class="w"><span>m</span><span>down</span><span class="dot">.</span><span class="sub">cc</span></span></h1>
  </div>`).join(""));
document.write(rows.map(([lab, mk, dot, sw]) => `
  <div class="row"><div class="lab">${lab} @28</div>
  <h1 class="lock sm ${dot}"><span class="m">${svg(marks[mk], sw)}</span><span class="w"><span>m</span><span>down</span><span class="dot">.</span><span class="sub">cc</span></span></h1>
  </div>`).join(""));

/* measure the text stem at 38.4px and 200px so the numbers in the answer are real */
const c = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
function stem(px, weight) {
  c.font = `${weight} ${px}px ui-monospace, "SF Mono", Menlo`;
  c.clearRect(0, 0, 40 * px, 2 * px);
  c.fillStyle = "#000"; c.fillRect(0, 0, 40 * px, 2 * px);
  c.fillStyle = "#fff"; c.textBaseline = "alphabetic";
  c.fillText("m", 2, px * 1.4);
  const d = c.getImageData(0, 0, 40 * px, 2 * px).data;
  const y = Math.round(px * 1.4 - px * 0.1); // inside the stem
  let runs = [], run = 0;
  for (let x = 0; x < 40 * px; x++) {
    const v = d[(y * 40 * px + x) * 4];
    if (v > 60) run++; else if (run) { runs.push(run); run = 0; }
  }
  const capM = c.measureText("M").actualBoundingBoxAscent;
  c.font = `${weight} ${px}px ui-monospace, "SF Mono", Menlo`;
  const met = c.measureText("m");
  return `${px}px/${weight}: stems ${runs.join(",")} px, cap ${(capM / px).toFixed(4)}em, adv ${(met.width / px).toFixed(4)}em`;
}
const info = document.createElement("pre");
info.style.cssText = "font:10px/1.6 var(--mono);color:#8b8b93;padding:16px 20px";
info.textContent = [stem(200, 500), stem(200, 400), stem(38.4, 500), stem(28, 500)].join("\n");
document.body.appendChild(info);
</script>
</body>
</html>
