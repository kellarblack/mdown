<!doctype html>
<html lang="en" data-theme="dark"><meta charset="utf-8"><title>word test</title>
<link rel="stylesheet" href="app.css">
<style>
 body{background:#0a0a0b;margin:0;padding:24px 20px;font-family:var(--mono)}
 .lab{color:#8b8b93;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:10px 0 2px}
 .w{font-family:var(--mono);font-weight:500;font-size:150px;line-height:1.1;letter-spacing:-.03em;color:var(--text);white-space:nowrap;margin:0}
 .dot{color:var(--accent)}
 .sub{font-size:.8em;color:var(--text-2)}
 .a .dot{margin:0 -.14em}
 .b .dot{margin-left:-.10em;margin-right:-.18em}
 .c .dot{margin:0 -.14em}
 .c .sub{font-size:.72em;font-weight:400;color:var(--text-3);letter-spacing:0;margin-left:2px}
 .d .dot{margin:0 -.14em}
 .d .sub{font-size:.85em;color:var(--text-2)}
 .e .dot{margin:0 -.14em}
 .e .sub{font-size:1em;color:var(--text-2)}
</style>
<div class="lab">A · tail .8em 500 text-2 · dot -.14/-.14</div>
<h1 class="w a">mdown<span class="dot">.</span><span class="sub">cc</span></h1>
<div class="lab">B · dot -.10 left / -.18 right</div>
<h1 class="w b">mdown<span class="dot">.</span><span class="sub">cc</span></h1>
<div class="lab">C · the old treatment (.72em, 400, text-3, tracking reset, +2px)</div>
<h1 class="w c">mdown<span class="dot">.</span><span class="sub">cc</span></h1>
<div class="lab">D · tail .85em</div>
<h1 class="w d">mdown<span class="dot">.</span><span class="sub">cc</span></h1>
<div class="lab">E · tail 1em (same size, one step dimmer)</div>
<h1 class="w e">mdown<span class="dot">.</span><span class="sub">cc</span></h1>
