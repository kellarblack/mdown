<!doctype html><meta charset="utf-8"><pre id="o"></pre><script>
const c=document.createElement("canvas");c.width=400;c.height=200;
const x=c.getContext("2d",{willReadFrequently:true});
const stack='ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace';
function rowRuns(weight,ch,y){
 x.clearRect(0,0,400,200); x.font=`${weight} 100px ${stack}`; x.fillStyle="#fff"; x.fillText(ch,60,150);
 const d=x.getImageData(0,0,400,200).data; const runs=[]; let s=-1;
 for(let i=0;i<400;i++){ const a=d[((y*400)+i)*4+3]; const on=a>60;
  if(on&&s<0)s=i; if(!on&&s>=0){runs.push(i-s);s=-1;} }
 return runs;
}
document.getElementById("o").textContent=JSON.stringify({
  m500_y120: rowRuns(500,"m",120), m400_y120: rowRuns(400,"m",120), m300_y120: rowRuns(300,"m",120)
});
</script>
