<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hero probe 2</title>
<style>
:root {
  --bg: #0a0a0b;
  --text: #ededee;
  --text-2: #a1a1a6;
  --text-3: #8b8b93;
  --accent: #ededee;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 15px; line-height: 1.55;
  padding: 18px clamp(16px, 4vw, 26px) 40px;
}
.stage { width: 100%; max-width: 720px; margin: 0 auto; }
.row { margin: 0 0 22px; }
.tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); margin: 0 0 2px; }
.lock { position: relative; }
.guide { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,80,80,.35); pointer-events: none; }
.guide.tray { background: rgba(80,180,255,.75); }
.probe { display: inline-block; width: 0; height: 0; }
.report { font-family: var(--mono); font-size: 10px; line-height: 1.4; color: var(--text-2); white-space: pre; margin-top: 2px; }
.divider { border-top: 1px solid rgba(255,255,255,.08); margin: 14px 0 18px; }
.phone { width: 288px; margin: 0 auto; }
.big { display: flex; align-items: baseline; gap: 14px; justify-content: center; zoom: 3; }

/* ---------------- BASELINE ---------------- */
.v-base .hero-logo { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 0 auto 10px; color: var(--text); }
.v-base .hero-mark { display: grid; place-items: center; flex: none; width: 44px; height: 44px; color: var(--text); }
.v-base .hero-mark svg { width: 100%; height: 100%; }
.v-base .hero-word { font-family: var(--mono); font-weight: 500; font-size: 38.4px; letter-spacing: -0.03em; line-height: 1; }
.v-base .hero-type { display: inline-block; }
.v-base .hero-word-down { display: inline-block; margin-left: 0.05em; }
.v-base .hero-word-dot { color: var(--accent); margin: 0 -0.14em; }
.v-base .hero-word-sub { font-size: 0.72em; font-weight: 400; color: var(--text-3); letter-spacing: 0; margin-left: 2px; }

/* ---------------- CANDIDATE ---------------- */
.v-new .hero-logo {
  display: flex; align-items: baseline; justify-content: center;
  gap: var(--gap, 0.02em);
  margin: 0 auto 22px;
  font-family: var(--mono);
  font-size: var(--fs, 39.2px);
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--text);
  white-space: nowrap;
}
.v-new .hero-mark { display: block; flex: none; line-height: 0; width: var(--mw, 1.26em); color: var(--text); }
.v-new .hero-mark svg { display: block; width: 100%; height: auto; }
.v-new .hero-word { display: inline; }
.v-new .hero-word-down { display: inline-block; }
.v-new .hero-word-dot { margin-left: var(--dl, -0.14em); margin-right: var(--dr, -0.14em); color: var(--accent); font-weight: var(--dw, 500); }
</style>
</head>
<body>
<div class="stage">

  <div class="row v-base">
    <p class="tag">baseline — what the user has</p>
    <div class="lock">
      <h1 class="hero-logo">
        <span class="hero-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <g class="mark-arrow"><path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/></g>
            <path class="mark-tray" d="M4 19h16"/>
          </svg>
        </span>
        <span class="hero-word"><span class="hero-type"><span class="hero-word-m">m</span><span class="hero-word-down">down</span><span class="hero-word-dot">.</span><span class="hero-word-sub">cc</span></span></span>
      </h1>
    </div>
    <div class="report" id="base-report"></div>
  </div>

  <div class="divider"></div>
  <div id="variants"></div>
</div>

<script>
const GLYPHS = ['m','d','o','w','n','.','c'];
const r2 = n => Math.round(n * 10) / 10;

function inkOf(font, ch) {
  const c = document.createElement('canvas').getContext('2d');
  c.font = font;
  const m = c.measureText(ch);
  return { adv: m.width, left: m.actualBoundingBoxLeft, right: m.actualBoundingBoxRight,
           asc: m.actualBoundingBoxAscent, desc: m.actualBoundingBoxDescent };
}

/* line tray, tight viewBox: ink bottom == viewBox bottom */
function svgLineTray(stroke, headHalf) {
  return `<svg viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"
   ><g class="mark-arrow"><path d="M12 5.6v7.6"/><path d="m${12 - headHalf} ${9.6} ${headHalf} ${headHalf} ${headHalf}-${headHalf}"/></g><path class="mark-tray" d="M5 19.5H19"/></svg>`;
}
/* cup tray, geometry lifted from the page's own downloads button */
function svgCupTray(stroke) {
  return `<svg viewBox="0 0 24 21.175" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"
   ><g class="mark-arrow"><path d="M12 4.2v10.2"/><path d="m7.9 10.3 4.1 4.1 4.1-4.1"/></g><path class="mark-tray" d="M5 17.6V19a1.6 1.6 0 0 0 1.6 1.6h10.8A1.6 1.6 0 0 0 19 19v-1.4"/></svg>`;
}

function lockupHTML(svg) {
  return `<h1 class="hero-logo"><span class="hero-mark" aria-hidden="true">${svg}</span><span class="hero-word">m<span class="hero-word-down">down</span><span class="hero-word-dot">.</span>cc<span class="probe"></span></span></h1>`;
}

const V = [
  { id: 'A', label: 'A · line tray · head 3.6', svg: svgLineTray(1.15, 3.6), mw: '1.26em', dl: '-0.14em', dr: '-0.14em', ns: 20 },
  { id: 'B', label: 'B · line tray · head 4.0', svg: svgLineTray(1.15, 4.0), mw: '1.26em', dl: '-0.14em', dr: '-0.14em', ns: 20 },
  { id: 'C', label: 'C · cup tray (site icon)', svg: svgCupTray(1.15), mw: '1.04em', dl: '-0.14em', dr: '-0.14em', ns: 21.175 },
  { id: 'D', label: 'D · line tray · mark 1.34em', svg: svgLineTray(1.15, 3.6), mw: '1.34em', dl: '-0.14em', dr: '-0.14em', ns: 20 },
  { id: 'E', label: 'E · A with asymmetric dot kern', svg: svgLineTray(1.15, 3.6), mw: '1.26em', dl: '-0.12em', dr: '-0.19em', ns: 20 },
  { id: 'F', label: 'F · A with heavier dot', svg: svgLineTray(1.15, 3.6), mw: '1.26em', dl: '-0.14em', dr: '-0.14em', dw: 700, ns: 20 },
];

document.getElementById('variants').innerHTML = V.map(v => `
  <div class="row v-new" id="v-${v.id}" style="--mw:${v.mw};--dl:${v.dl};--dr:${v.dr};--dw:${v.dw || 500}">
    <p class="tag">${v.label}</p>
    <div class="lock">${lockupHTML(v.svg)}</div>
    <div class="report" id="r-${v.id}"></div>
  </div>`).join('') + `
  <div class="divider"></div>
  <p class="tag">chosen mark at 3× (craft check)</p>
  <div class="big">${V[0].svg.replace('aria-hidden', 'aria-hidden').replace('<svg', '<svg style="width:120px;height:auto;display:block"')}</div>
  <div class="divider"></div>
  <p class="tag">at 320–360px width (28px type)</p>
  <div class="phone"><div class="row v-new" id="v-phone" style="--mw:1.26em;--fs:28px">
    <div class="lock"></div><div class="report" id="r-phone"></div></div></div>`;

function measure(root, stroke, ns) {
  const h1 = root.querySelector('.hero-logo');
  const word = root.querySelector('.hero-word');
  const probe = root.querySelector('.probe');
  const dot = root.querySelector('.hero-word-dot');
  const mark = root.querySelector('.hero-mark');
  const tray = root.querySelector('.mark-tray');
  const arrow = root.querySelector('.mark-arrow');
  const cs = getComputedStyle(h1);
  const fs = parseFloat(cs.fontSize);
  const font = `${cs.fontWeight} ${fs}px ${cs.fontFamily}`;
  const g = {}; GLYPHS.forEach(ch => g[ch] = inkOf(font, ch));
  const baselineY = probe.getBoundingClientRect().bottom;
  const dotR = dot.getBoundingClientRect();
  const markR = mark.getBoundingClientRect();
  const mDot = getComputedStyle(dot);
  const A = g['m'].adv;
  const dotInkL = dotR.left - g['.'].left;
  const dotInkR = dotR.left + g['.'].right;
  const nInkR = (dotR.left - parseFloat(mDot.marginLeft)) - (A - g['n'].right);
  const cInkL = (dotR.left + A + parseFloat(mDot.marginRight)) - g['c'].left;
  const letterGap = (A - g['n'].right) + (-g['o'].left);
  const scale = markR.height / ns;
  const strokePx = stroke * scale;
  const topUnit = parseFloat(stroke) && ns > 20.5 ? 4.2 : 5.6;
  const inkTop = markR.top + (topUnit - stroke / 2) * scale;
  const trayR = tray.getBoundingClientRect();
  const trayInkBottom = trayR.bottom + strokePx / 2;
  const inkBottom = markR.top + (ns + 0) * scale + 0;   // viewBox bottom == ink bottom
  const asc = g['d'].asc;
  const markInkRight = markR.left + ((19 + stroke / 2) / 24) * markR.width;
  const mInkLeft = word.getBoundingClientRect().left - g['m'].left;
  const info = {
    fs: r2(fs), markW: r2(markR.width), markH: r2(markR.height),
    stroke: r2(strokePx),
    inkVsAsc: r2((inkBottom - inkTop) / asc),
    inkTopVsAsc: r2(inkTop - (baselineY - asc)),
    trayVsBase: r2(trayInkBottom - baselineY),
    gapMarkToM: r2(mInkLeft - markInkRight),
    dotL: r2(dotInkL - nInkR), dotR: r2(cInkL - dotInkR), letterGap: r2(letterGap),
    contentW: r2(word.getBoundingClientRect().width + markR.width),
    _base: baselineY, _tray: trayInkBottom,
  };
  info.gapEm = r2(info.gapMarkToM / fs);
  return info;
}

function guides(root, base, tray) {
  const lock = root.querySelector('.lock');
  const top = lock.getBoundingClientRect().top;
  lock.insertAdjacentHTML('beforeend',
    `<div class="guide" style="top:${base - top}px"></div><div class="guide tray" style="top:${tray - top - 0.5}px"></div>`);
}

function run() {
  const out = { base: {}, v: {} };
  const baseRoot = document.querySelector('.v-base');
  {
    const word = baseRoot.querySelector('.hero-word');
    const mark = baseRoot.querySelector('.hero-mark');
    const tray = baseRoot.querySelector('.mark-tray');
    const shaft = baseRoot.querySelector('.mark-arrow path');
    const cs = getComputedStyle(word);
    const font = `${cs.fontWeight} ${parseFloat(cs.fontSize)}px ${cs.fontFamily}`;
    const g = {}; GLYPHS.forEach(ch => g[ch] = inkOf(font, ch));
    const p = document.createElement('span'); p.className = 'probe'; word.appendChild(p);
    const baselineY = p.getBoundingClientRect().bottom; p.remove();
    const markR = mark.getBoundingClientRect();
    const trayR = tray.getBoundingClientRect();
    const shaftR = shaft.getBoundingClientRect();
    const strokePx = 2 * (markR.width / 24);
    out.base = {
      stroke: r2(strokePx),
      inkVsAsc: r2(((trayR.bottom + strokePx / 2) - (shaftR.top - strokePx / 2)) / g['d'].asc),
      trayVsBase: r2((trayR.bottom + strokePx / 2) - baselineY),
      gapMarkToM: r2((word.getBoundingClientRect().left - g['m'].left) - (markR.left + (20 / 24) * markR.width)),
      gapEm: r2(((word.getBoundingClientRect().left - g['m'].left) - (markR.left + (20 / 24) * markR.width)) / parseFloat(cs.fontSize)),
    };
    document.getElementById('base-report').textContent =
      `stroke ${out.base.stroke}px (page icons: ~1.2–1.3px rendered) · ink ${out.base.inkVsAsc}× ascender · tray ${out.base.trayVsBase}px off the baseline · mark→m ${out.base.gapMarkToM}px (${out.base.gapEm}em)`;
    guides(baseRoot, baselineY, trayR.bottom + strokePx / 2);
  }

  V.forEach(v => {
    const root = document.getElementById('v-' + v.id);
    const stroke = parseFloat(v.svg.match(/stroke-width="([\d.]+)"/)[1]);
    const info = measure(root, stroke, v.ns);
    out.v[v.id] = info;
    document.getElementById('r-' + v.id).textContent =
      `mark ${info.markW}×${info.markH} · stroke ${info.stroke}px · ink ${info.inkVsAsc}× asc · tray ${info.trayVsBase}px · gap ${info.gapMarkToM}px (${info.gapEm}em) · dot ${info.dotL}/${info.dotR} (letters ${info.letterGap})`;
    guides(root, info._base, info._tray);
  });

  const ph = document.getElementById('v-phone');
  ph.querySelector('.lock').innerHTML = lockupHTML(V[0].svg);
  {
    const info = measure(ph, 1.15, 20);
    out.phone = info;
    document.getElementById('r-phone').textContent =
      `mark ${info.markW}×${info.markH} · stroke ${info.stroke}px · ink ${info.inkVsAsc}× asc · tray ${info.trayVsBase}px · gap ${info.gapMarkToM}px · content ${info.contentW}px of 288`;
    guides(ph, info._base, info._tray);
  }

  const holder = document.createElement('script');
  holder.type = 'application/json'; holder.id = 'out';
  holder.textContent = JSON.stringify(out);
  document.body.appendChild(holder);
  document.title = 'ready';
}
window.addEventListener('load', run);
</script>
</body>
</html>
