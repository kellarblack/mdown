<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>real page harness</title>
<style>
  html, body { margin: 0; background: #16161a; }
  #clip { overflow: hidden; }
  iframe { border: 0; display: block; background: #0a0a0b; }
</style>
</head>
<body>
<div id="clip"><iframe id="f" src="/mdown/index.html"></iframe></div>
<script>
const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 1440);
const MARK = P.get('mark') || 'line';      // line | cup
const MW = P.get('mw') || '1.3';
const FS = P.get('fs') || 'clamp(1.75rem, 4.3vw, 2.6rem)';
const THEME = P.get('theme') || 'dark';
const CROP = P.get('crop') === '1';
const TOP = +(P.get('top') || 200);
const CLIPH = +(P.get('cliph') || 320);

const f = document.getElementById('f');
f.width = W;
f.height = CROP ? 900 : 900;
if (CROP) {
  const clip = document.getElementById('clip');
  clip.style.marginTop = (-TOP) + 'px';
  clip.style.height = CLIPH + 'px';
  clip.style.marginTop = '0px';
  f.style.marginTop = (-TOP) + 'px';
  document.getElementById('clip').style.height = CLIPH + 'px';
  document.documentElement.style.height = CLIPH + 'px';
}

const SVGS = {
  line: (s) => `<svg viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round"><g class="mark-arrow"><path d="M12 5.6v7.6"/><path d="m8.4 9.6 3.6 3.6 3.6-3.6"/></g><path class="mark-tray" d="M5 19.5H19"/></svg>`,
  cup:  (s) => `<svg viewBox="0 0 24 21.175" fill="none" stroke="currentColor" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round"><g class="mark-arrow"><path d="M12 4.2v10.2"/><path d="m7.9 10.3 4.1 4.1 4.1-4.1"/></g><path class="mark-tray" d="M5 17.6V19a1.6 1.6 0 0 0 1.6 1.6h10.8A1.6 1.6 0 0 0 19 19v-1.4"/></svg>`,
};

const CSS = `
.hero-logo {
  display: flex; align-items: baseline; justify-content: center;
  gap: 0;
  margin: 0 auto clamp(18px, 3vh, 28px);
  font-family: var(--mono);
  font-size: ${FS};
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--text);
  white-space: nowrap;
}
.hero-mark { flex: none; display: block; line-height: 0; width: ${MW}em; }
.hero-mark svg { display: block; width: 100%; height: auto; }
.hero-word { display: inline; }
.hero-word-down { display: inline-block; margin: 0; }
.hero-word-dot { color: var(--accent); margin: 0 -0.18em 0 -0.12em; }
.hero-logo, .mark-arrow, .hero-word-down { animation: none !important; }
`;

f.addEventListener('load', () => setTimeout(() => {
  const doc = f.contentDocument;
  const w = doc.defaultView || f.contentWindow;
  if (THEME === 'light') doc.documentElement.setAttribute('data-theme', 'light');
  const h = doc.querySelector('.hero-logo');
  const comp0 = doc.querySelector('.composer').getBoundingClientRect();
  if (P.get('orig') === '1') {
    const oh = doc.querySelector('.hero-logo').getBoundingClientRect();
    document.title = 'ready ' + JSON.stringify({ w: W, orig: true,
      fs: w.getComputedStyle(doc.querySelector('.hero-word')).fontSize,
      h1: [Math.round(oh.width), Math.round(oh.height)], top: Math.round(oh.top), bottom: Math.round(oh.bottom),
      composerTop: Math.round(comp0.top) });
    return;
  }
  const s = doc.createElement('style');
  s.textContent = `
    .hero-word-m, .hero-word-sub, .hero-type { display: inline; font-size: inherit; color: inherit; font-weight: inherit; letter-spacing: inherit; margin: 0; }
    .hero-mark { width: ${MW}em !important; height: auto !important; }
  ` + CSS;
  doc.head.appendChild(s);
  const stroke = P.get('stroke') || '1.15';
  h.innerHTML = `<span class="hero-mark" aria-hidden="true">${SVGS[MARK](stroke)}</span>`
    + `<span class="hero-word">m<span class="hero-word-down">down</span><span class="hero-word-dot">.</span>cc</span>`
    + `<span class="sr-only"> — a media downloader for video and audio</span>`;

  // measure the mono advance in the page's real context
  const probe = doc.createElement('span');
  probe.textContent = '0000000000';
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font-family:var(--mono);font-size:41.6px;font-weight:500;letter-spacing:0';
  doc.body.appendChild(probe);
  const cell = probe.getBoundingClientRect().width / 10;
  probe.remove();

  if (P.get('t') === '1') {
    const shaft = h.querySelector('.mark-arrow path');
    const before = shaft.getBoundingClientRect().top;
    const g = h.querySelector('.mark-arrow');
    g.style.transform = 'translate(0, -2.6px)';
    const after = shaft.getBoundingClientRect().top;
    const mk = h.querySelector('.hero-mark').getBoundingClientRect();
    document.title = 'ready ' + JSON.stringify({ shift: Math.round((before - after) * 100) / 100,
      scale: Math.round((mk.height / 21.175) * 100) / 100, markH: Math.round(mk.height * 10) / 10 });
    return;
  }
  const r = h.getBoundingClientRect();
  const mark = h.querySelector('.hero-mark').getBoundingClientRect();
  const comp = doc.querySelector('.composer').getBoundingClientRect();
  document.title = 'ready ' + JSON.stringify({
    w: W, fs: w.getComputedStyle(h).fontSize, cell: Math.round(cell * 100) / 100,
    h1: [Math.round(r.width), Math.round(r.height)],
    top: Math.round(r.top), bottom: Math.round(r.bottom),
    markW: Math.round(mark.width * 10) / 10, markH: Math.round(mark.height * 10) / 10,
    composerTop: Math.round(comp.top),
  });
}, 300));
</script>
</body>
</html>
