<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%}iframe{display:block;width:100vw;height:100vh;border:0}</style></head>
<body>
<iframe id="f" src="/index.html"></iframe>
<script>
const view = new URLSearchParams(location.search).get("view") || "";
const f = document.getElementById("f");
f.contentWindow.localStorage.setItem("mdown.settings", JSON.stringify({ instance: "http://127.0.0.1:4320" }));
f.src = "/index.html?x=" + Date.now();
const wait = (ms) => new Promise(r => setTimeout(r, ms));
(async () => {
  for (let i = 0; i < 120 && !f.contentWindow.md; i++) await wait(100);
  await wait(1500);
  const d = f.contentDocument;
  d.querySelector("#url-input").blur();
  if (view === "sources") d.querySelector("#open-sources").click();
  await wait(800);
})();
</script>
</body></html>
