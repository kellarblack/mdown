<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mdown social card</title>
<!--
  The 1200x630 card every link preview uses. Not published: render it with

    chrome --headless --disable-gpu --hide-scrollbars --window-size=1200,630 \
      --screenshot=assets/og-card.png tests/og-card.html

  It is a standalone page on purpose — the app itself is versioned, themed and
  connects to a server, none of which belongs in a static preview.
-->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #0a0a0b; }
  body {
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    color: #ededee;
    display: grid; place-items: center;
    overflow: hidden;
  }
  .card { width: 100%; height: 100%; display: grid; place-items: center; position: relative; }
  .frame {
    position: absolute; inset: 26px; border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
  }
  .inner { display: grid; justify-items: center; gap: 26px; transform: translateY(-6px); }

  .logo { display: flex; align-items: center; gap: 22px; }
  .mark { color: #ededee; }
  .mark svg { display: block; width: 76px; height: 76px; }
  .word { font-size: 82px; letter-spacing: -0.045em; font-weight: 500; line-height: 1; }
  .word .dot { color: #8b8b93; }
  .word .cc { color: #a1a1a6; font-weight: 400; }

  .tagline { font-size: 27px; color: #a1a1a6; letter-spacing: -0.01em; }

  .chips { display: flex; gap: 10px; margin-top: 6px; }
  .chip {
    padding: 8px 15px; border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #8b8b93; font-size: 18px; letter-spacing: 0.02em;
  }
  .chip.live { color: #ededee; border-color: rgba(255, 255, 255, 0.2); }
  .chip.live::before {
    content: ""; display: inline-block; vertical-align: 2px;
    width: 8px; height: 8px; border-radius: 50%; background: #4ade80;
    margin-right: 9px; box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.14);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="frame" aria-hidden="true"></div>
    <div class="inner">
      <div class="logo">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4 19h16"/>
          </svg>
        </span>
        <span class="word">mdown<span class="dot">.</span><span class="cc">cc</span></span>
      </div>
      <div class="tagline">paste a link. keep the file.</div>
      <div class="chips">
        <span class="chip live">no ads</span>
        <span class="chip">no account</span>
        <span class="chip">no tracking</span>
      </div>
    </div>
  </div>
</body>
</html>
