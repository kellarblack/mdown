<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>sources test</title>
<style>
  html, body { margin: 0; background: #08090c; color: #ddd; font: 12px ui-monospace, Menlo, monospace; }
  iframe { display: block; width: 900px; height: 700px; border: 0; }
  pre { padding: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<!--
  The sources panel: every source this instance can reach, grouped by what you
  get, filterable, with the encrypted ones listed so they read as refused
  rather than broken.

    python3 tests/mock-api.py 4320 &
    python3 -m http.server 4331 &
    chrome --headless --disable-gpu "http://127.0.0.1:4331/tests/sources.test.html?report=1"
-->
<iframe id="app" src="../index.html"></iframe>
<pre id="log">starting…</pre>
<script>
const log = document.getElementById("log");
const results = [];
let failures = 0;
function record(name, ok, detail) {
  if (!ok) failures++;
  results.push({ name, ok, detail: detail || "" });
  log.innerHTML += `\n${ok ? "PASS" : "FAIL"}  ${name}${detail ? "  — " + detail : ""}`;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function waitFor(fn, ms = 15000) {
  const start = Date.now();
  while (Date.now() - start < ms) { try { if (fn()) return true; } catch (e) {} await sleep(120); }
  return false;
}

async function main() {
  const frame = document.getElementById("app");
  frame.contentWindow.localStorage.setItem("mdown.settings",
    JSON.stringify({ instance: "http://127.0.0.1:4320" }));
  frame.src = "../index.html?sources=" + Date.now();

  const booted = await waitFor(() => frame.contentDocument && frame.contentWindow.md, 20000);
  record("the app boots", booted);
  if (!booted) { window.__results = { total: results.length, failures, results }; return; }
  await sleep(350);

  const doc = frame.contentDocument;
  const win = frame.contentWindow;
  const button = doc.querySelector("#open-sources");
  record("there is a sources trigger at the top",
    !!button && Math.abs(button.getBoundingClientRect().left + button.getBoundingClientRect().width / 2 -
      frame.contentWindow.innerWidth / 2) < 4,
    button ? button.textContent.trim() : "missing");

  const plusBefore = win.getComputedStyle(doc.querySelector(".sources-chev")).transform;
  button.click();
  const opened = await waitFor(() => !doc.querySelector("#sources-panel").hidden, 5000);
  record("the panel opens", opened, "aria-expanded=" + button.getAttribute("aria-expanded"));

  const plusAfter = win.getComputedStyle(doc.querySelector(".sources-chev")).transform;
  record("the chevron turns over", plusBefore !== plusAfter && /matrix/.test(plusAfter),
    plusBefore + " -> " + plusAfter);
  record("the trigger reports its state", button.getAttribute("aria-expanded") === "true", button.getAttribute("aria-expanded"));

  const rows = () => [...doc.querySelectorAll(".source-chip")];
  record("it lists the sources it can reach", rows().length >= 10, rows().length + " sources");

  const names = rows().map((r) => r.textContent.toLowerCase());
  record("it lists every source we accept, not one server's subset",
    names.length >= 30 && names.indexOf("youtube") >= 0 && names.indexOf("rumble") >= 0,
    names.length + " sources, rumble=" + (names.indexOf("rumble") >= 0));
  record("and nothing we refuse",
    names.indexOf("spotify") < 0 && names.indexOf("giphy") < 0,
    "spotify/giphy absent");
  const panelRect = doc.querySelector("#sources-panel").getBoundingClientRect();
  const logoRect = doc.querySelector(".hero-logo").getBoundingClientRect();
  record("the panel is compact", panelRect.height <= 340 && panelRect.width <= 480,
    Math.round(panelRect.width) + "x" + Math.round(panelRect.height));
  const buttonRect = button.getBoundingClientRect();
  record("it opens downward from the trigger", panelRect.top >= buttonRect.bottom - 1,
    "panel top " + Math.round(panelRect.top) + " vs button bottom " + Math.round(buttonRect.bottom));


  record("there is no filter to maintain", !doc.querySelector("#sources-search"), "no search field");

  // each chip is a door to the site it names
  const links = rows().filter((r) => r.tagName === "A" && r.getAttribute("href"));
  record("every chip links to the site it names", links.length === rows().length,
    links.length + "/" + rows().length + " links");
  const unsafe = links.filter((a) => !/^https:\/\//.test(a.href) ||
    a.getAttribute("target") !== "_blank" || a.getAttribute("rel") !== "noopener noreferrer");
  record("and every one opens safely in a new tab", unsafe.length === 0,
    unsafe.map((a) => a.textContent).join(", ") || "all noopener");
  const titled = rows().filter((r) => (r.getAttribute("title") || "").indexOf(r.textContent.trim()) === 0);
  record("a slow reader can hover for the full address", titled.length === rows().length,
    (rows()[0].getAttribute("title") || "").slice(0, 40));

  doc.body.click();
  await sleep(200);
  record("it closes when you click away",
    doc.querySelector("#sources-panel").hidden === true && button.getAttribute("aria-expanded") === "false",
    "hidden=" + doc.querySelector("#sources-panel").hidden);

  /* ---- on a phone it has to open where the button is ------------------- */
  frame.style.width = "390px";
  frame.style.height = "780px";
  await sleep(400);
  doc.querySelector("#sources-panel").hidden = true;
  button.click();
  await sleep(350);
  const phone = doc.querySelector("#sources-panel").getBoundingClientRect();
  const phoneTrigger = button.getBoundingClientRect();
  record("on a phone the panel opens under the button, not at the other end of the screen",
    phone.top >= phoneTrigger.bottom - 1 && phone.top - phoneTrigger.bottom < 60,
    Math.round(phoneTrigger.bottom) + " → " + Math.round(phone.top));
  record("and the whole list fits on that phone",
    phone.bottom <= frame.contentWindow.innerHeight + 1,
    Math.round(phone.bottom) + " of " + frame.contentWindow.innerHeight);
  record("with no sideways scroll", doc.documentElement.scrollWidth <= 391,
    doc.documentElement.scrollWidth + "px wide");

  window.__results = { total: results.length, failures, results };
}
main().catch((e) => { record("harness crashed", false, String(e)); window.__results = { total: results.length, failures, results }; });
</script>
<script>
if (location.search.indexOf("report") >= 0) {
  const started = Date.now();
  const timer = setInterval(() => {
    if (window.__results) {
      clearInterval(timer);
      fetch("http://127.0.0.1:4320/report", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({ page: location.pathname, ms: Date.now() - started }, window.__results)) }).catch(() => {});
    } else if (Date.now() - started > 60000) clearInterval(timer);
  }, 400);
}
</script>
</body>
</html>
