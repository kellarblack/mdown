<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>large file test</title>
<style>
  html, body { margin: 0; background: #08090c; color: #ddd; font: 12px ui-monospace, Menlo, monospace; }
  iframe { display: block; width: 900px; height: 620px; border: 0; }
  pre { padding: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<!--
  A 300 MB file must never be buffered in the JS heap. Past the limit the client
  hands the tunnel URL to the browser, which streams to disk and can resume.

    python3 tests/mock-api.py 4320 &
    python3 -m http.server 4331 &
    chrome --headless --disable-gpu \
      "http://127.0.0.1:4331/tests/large.test.html?report=1"
-->
<iframe id="app" src="../index.html"></iframe>
<pre id="log">starting…</pre>

<script>
const log = document.getElementById("log");
const results = [];
let failures = 0;

function record(name, ok, detail) {
  if (!ok) failures++;
  results.push({ name, ok, detail: detail || "" });
  log.innerHTML += `\n${ok ? "PASS" : "FAIL"}  ${name}${detail ? "  — " + detail : ""}`;
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function waitFor(fn, ms = 20000) {
  const start = Date.now();
  while (Date.now() - start < ms) {
    try { if (fn()) return true; } catch (e) {}
    await sleep(120);
  }
  return false;
}

async function main() {
  const frame = document.getElementById("app");

  // "ask" so the handoff does not fire a real navigation during the test
  frame.contentWindow.localStorage.setItem("mdown.settings",
    JSON.stringify({ instance: "http://127.0.0.1:4320", savingMethod: "ask" }));
  frame.src = "../index.html?t=" + Date.now();

  const doc = () => frame.contentDocument;
  const win = () => frame.contentWindow;
  const ready = await waitFor(() => doc() && doc().querySelector("#url-input") && win().md, 20000);
  record("app loads", ready);
  if (!ready) { window.__results = { total: results.length, failures, results }; return; }

  const input = doc().querySelector("#url-input");
  input.value = "https://youtube.com/watch?v=bigfile";
  input.dispatchEvent(new Event("input", { bubbles: true }));
  doc().querySelector("#fetch-form").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));

  const settled = await waitFor(() => {
    const items = win().md.state().items;
    return items.length && ["ready", "done", "error"].includes(items[0].status);
  }, 25000);

  const item = win().md.state().items[0] || {};

  record("large download settles", settled, item.status);
  record("it did not fail", item.status !== "error", item.error || "");
  record("size is known and big", (item.size || 0) > 200 * 1024 * 1024, item.size + " bytes");
  record("nothing was buffered in memory", !item.hasBlob, "hasBlob=" + item.hasBlob);
  record("a direct link is kept", /^https?:/.test(item.sourceUrl || ""), item.sourceUrl || "");
  record("the user is told it is large", /large file/i.test(item.detail || ""), item.detail || "");
  record("the filename survived", /\.mp4$/.test(item.filename || ""), item.filename || "");

  window.__results = { total: results.length, failures, results };
}

main().catch((e) => {
  record("harness crashed", false, String(e));
  window.__results = { total: results.length, failures, results };
});
</script>

<script>
/* With ?report, POST results so run-all.sh can read them without devtools. */
if (location.search.indexOf("report") >= 0) {
  const started = Date.now();
  const timer = setInterval(() => {
    if (window.__results) {
      clearInterval(timer);
      fetch("http://127.0.0.1:4320/report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({ page: location.pathname, ms: Date.now() - started }, window.__results))
      }).catch(() => {});
    } else if (Date.now() - started > 90000) clearInterval(timer);
  }, 400);
}
</script>
</body>
</html>
