<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>make tool fixtures</title></head>
<body>
<p id="status">generating…</p>
<script type="module">
  /* Real fixtures for the subtitle + metadata tools, built with the same engine. */
  const BASE = new URL("../assets/vendor/ffmpeg/", import.meta.url).href;
  const { FFmpeg } = await import(BASE + "ffmpeg/index.js");
  const ff = new FFmpeg();
  await ff.load({ coreURL: BASE + "core/ffmpeg-core.js", wasmURL: BASE + "core/ffmpeg-core.wasm" });

  const enc = new TextEncoder();
  const srt = (lines) => lines.join("\n") + "\n";
  const eng = srt([
    "1", "00:00:00,000 --> 00:00:01,000", "Hello from the English track.", "",
    "2", "00:00:01,000 --> 00:00:02,000", "Second line here.", ""
  ]);
  const spa = srt([
    "1", "00:00:00,000 --> 00:00:01,000", "Hola desde la pista en español.", "",
    "2", "00:00:01,000 --> 00:00:02,000", "Segunda línea.", ""
  ]);

  await ff.writeFile("eng.srt", enc.encode(eng));
  await ff.writeFile("spa.srt", enc.encode(spa));

  const src = await (await fetch("./media/sample.mp4")).arrayBuffer();
  await ff.writeFile("base.mp4", new Uint8Array(src));
  const srcMkv = await (await fetch("./media/sample.mkv")).arrayBuffer();
  await ff.writeFile("base.mkv", new Uint8Array(srcMkv));

  const jobs = [
    ["subs.mkv", [
      "-f", "lavfi", "-i", "color=c=black:s=160x90:d=2",
      "-f", "lavfi", "-i", "sine=frequency=440:duration=2",
      "-i", "eng.srt", "-i", "spa.srt",
      "-map", "0:v", "-map", "1:a", "-map", "2:s", "-map", "3:s",
      "-c:v", "libx264", "-pix_fmt", "yuv420p", "-c:a", "aac", "-c:s", "srt",
      "-metadata:s:s:0", "language=eng", "-metadata:s:s:0", "title=English",
      "-metadata:s:s:1", "language=spa", "-metadata:s:s:1", "title=Español"
    ]],
    ["subs-mp4.mp4", [
      "-i", "base.mp4", "-i", "eng.srt",
      "-map", "0:v", "-map", "0:a", "-map", "1:s",
      "-c:v", "copy", "-c:a", "copy", "-c:s", "mov_text",
      "-metadata:s:s:0", "language=eng", "-metadata:s:s:0", "title=English"
    ]],
    ["meta.mp4", [
      "-i", "base.mp4", "-map", "0", "-c", "copy",
      "-metadata", "title=Holiday Clip", "-metadata", "comment=private note",
      "-metadata", "artist=Someone Real", "-metadata", "creation_time=2021-05-04T10:00:00Z",
      "-metadata", "location=+37.77-122.41/", "-movflags", "use_metadata_tags+faststart"
    ]],
    ["meta.mkv", [
      "-i", "base.mkv", "-map", "0", "-c", "copy",
      "-metadata", "title=Secret Project", "-metadata", "comment=do not share",
      "-metadata", "creation_time=2020-01-01T00:00:00Z"
    ]]
  ];

  for (const [name, args] of jobs) {
    const code = await ff.exec(["-hide_banner", "-y", ...args, name]);
    document.getElementById("status").textContent = name + " -> " + code;
  }

  const names = jobs.map(([n]) => n);
  const out = {};
  for (const name of names) {
    const data = await ff.readFile(name);
    let s = "";
    for (let i = 0; i < data.length; i += 0x8000) s += String.fromCharCode.apply(null, data.subarray(i, i + 0x8000));
    out[name] = btoa(s);
    await ff.deleteFile(name);
  }

  window.__fixtures = out;
  document.getElementById("status").textContent = "done: " + names.join(", ");
</script>
</body>
</html>
