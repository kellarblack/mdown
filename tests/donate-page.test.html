<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>donate page test</title>
<style>
  html, body { margin: 0; background: #08090c; color: #ddd; font: 12px ui-monospace, Menlo, monospace; }
  iframe { display: block; width: 900px; height: 700px; border: 0; }
  pre { padding: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<!--
  The donate page must be honest in its shipped state: donations closed means
  a plain "nothing to donate to" message, no payment links, no half-rendered
  sections — and the app must not link to it.

    python3 tests/mock-api.py 4320 &
    python3 -m http.server 4331 &
    chrome --headless --disable-gpu "http://127.0.0.1:4331/tests/donate-page.test.html?report=1"
-->
<iframe id="donate" src="../donate.html"></iframe>
<iframe id="app" src="../index.html" style="display:none"></iframe>
<pre id="log">starting…</pre>
<script>
const log = document.getElementById("log");
const results = [];
let failures = 0;
function record(name, ok, detail) {
  if (!ok) failures++;
  results.push({ name, ok, detail: detail || "" });
  log.innerHTML += `\n${ok ? "PASS" : "FAIL"}  ${name}${detail ? "  — " + detail : ""}`;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function waitFor(fn, ms = 15000) {
  const start = Date.now();
  while (Date.now() - start < ms) { try { if (fn()) return true; } catch (e) {} await sleep(120); }
  return false;
}

async function main() {
  const frame = document.getElementById("donate");
  const ready = await waitFor(() => frame.contentDocument && frame.contentDocument.querySelector(".donate-hero"), 15000);
  record("the page loads", ready);
  if (!ready) { window.__results = { total: results.length, failures, results }; return; }
  const doc = frame.contentDocument;

  record("it explains what a tip is for",
    /no ads, no accounts/i.test(doc.body.textContent), "no ads, no accounts");
  record("it does not quote what the site costs to run",
    !/\$\s?\d|a year|VPS|per month/i.test(doc.body.textContent),
    (doc.body.textContent.match(/\$\s?\d+|a year|VPS/i) || [""])[0] || "no figures");
  record("the jar says it is closed", /closed/i.test(doc.querySelector("#support-state").textContent),
    doc.querySelector("#support-state").textContent);

  record("closed donations say so", !doc.querySelector("#dormant").hidden, "dormant visible");
  record("no payment cards while closed", doc.querySelector("#funding").hidden, "funding hidden");
  record("no addresses while closed", doc.querySelector("#alt").hidden, "alt hidden");

  record("sharing still works", !!doc.querySelector("#copy-link"), "copy link button");

  // nothing may load from a third party; share links are outgoing only
  // a canonical <link> points at the URL, it does not fetch anything
  const loads = [...doc.querySelectorAll("script[src^='http'], img[src^='http'], iframe[src^='http'], link[href^='http']")]
    .filter(n => !/^(canonical|alternate)$/i.test(n.getAttribute("rel") || ""));
  record("nothing loads from a third party", loads.length === 0, loads.length + " foreign nodes");

  const share = [...doc.querySelectorAll("[data-share]")];
  record("share chips exist for the usual places", share.length === 4, share.map(a => a.dataset.share).join(", "));
  const badShare = share.filter(a => !a.href || !/^https:\/\//.test(a.href) || a.rel !== "noopener noreferrer");
  record("every share chip is a safe outgoing link", badShare.length === 0,
    badShare.map(a => a.dataset.share).join(", ") || "all encoded + noopener");
  record("sharing carries the site, not a referral tag",
    share.every(a => a.href.indexOf("mdown.cc") >= 0),
    (share[0] && share[0].href.slice(0, 60)) || "");

  // and the main app must not advertise a closed tip jar
  const appFrame = document.getElementById("app");
  await waitFor(() => appFrame.contentDocument && appFrame.contentWindow.md, 15000);
  await sleep(200);
  const appDoc = appFrame.contentDocument;
  const navDonate = appDoc.querySelector(".nav-donate");
  record("the nav hides donate while it is closed", !navDonate || navDonate.hidden, navDonate ? "hidden=" + navDonate.hidden : "no link");

  // the same page at phone width must not scroll sideways
  frame.style.width = "390px";
  await sleep(300);
  const ddoc = frame.contentDocument;
  record("no sideways scroll at 390px",
    ddoc.documentElement.scrollWidth <= 391,
    ddoc.documentElement.scrollWidth + "px wide");

  window.__results = { total: results.length, failures, results };
}
main().catch((e) => { record("harness crashed", false, String(e)); window.__results = { total: results.length, failures, results }; });
</script>
<script>
if (location.search.indexOf("report") >= 0) {
  const started = Date.now();
  const timer = setInterval(() => {
    if (window.__results) {
      clearInterval(timer);
      fetch("http://127.0.0.1:4320/report", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({ page: location.pathname, ms: Date.now() - started }, window.__results)) }).catch(() => {});
    } else if (Date.now() - started > 60000) clearInterval(timer);
  }, 400);
}
</script>
</body>
</html>
