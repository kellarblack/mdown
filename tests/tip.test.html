<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>tip jar test</title>
<style>
  html, body { margin: 0; background: #08090c; color: #ddd; font: 12px ui-monospace, Menlo, monospace; }
  iframe { display: block; width: 390px; height: 844px; border: 0; }
  pre { padding: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<!--
  Three buttons open the tip jar and they must all work: the one in the top bar,
  the one in Settings, and the one in the help dialog. The last two open it from
  inside a click that is also closing a sheet — which is exactly how it used to
  open and close in the same tick, looking dead.

    python3 tests/mock-api.py 4320 &
    python3 -m http.server 4331 &
    chrome --headless --disable-gpu "http://127.0.0.1:4331/tests/tip.test.html?report=1"
-->
<iframe id="app" src="../index.html"></iframe>
<pre id="log">starting…</pre>
<script>
const log = document.getElementById("log");
const results = [];
let failures = 0;
function record(name, ok, detail) {
  if (!ok) failures++;
  results.push({ name, ok, detail: detail || "" });
  log.innerHTML += `\n${ok ? "PASS" : "FAIL"}  ${name}${detail ? "  — " + detail : ""}`;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function waitFor(fn, ms = 15000) {
  const start = Date.now();
  while (Date.now() - start < ms) { try { if (fn()) return true; } catch (e) {} await sleep(100); }
  return false;
}

async function main() {
  const frame = document.getElementById("app");
  frame.contentWindow.localStorage.setItem("mdown.settings",
    JSON.stringify({ instance: "http://127.0.0.1:4320" }));
  frame.src = "../index.html?tip=" + Date.now();

  const booted = await waitFor(() => frame.contentDocument && frame.contentDocument.querySelector("#tip-pop"), 20000);
  record("the app boots", booted);
  if (!booted) { window.__results = { total: results.length, failures, results }; return; }

  const doc = frame.contentDocument;
  const win = frame.contentWindow;
  const pop = doc.querySelector("#tip-pop");
  const visible = () => !pop.hidden && pop.getBoundingClientRect().height > 10;
  const close = async () => { doc.body.click(); await sleep(320); };
  await sleep(700);

  // 1. the top bar
  doc.querySelector("#open-donate-top").click();
  await sleep(320);
  record("the top bar opens the jar", visible());
  record("and it has something to click", !!pop.querySelector(".donate-card, .donate-row"),
    pop.querySelectorAll(".donate-row").length + " rows");
  await close();

  // 2. settings — the case that used to open and shut in the same click
  doc.querySelector("#open-settings").click();
  await sleep(320);
  const settingsBtn = doc.querySelector("#open-donate-settings");
  record("settings offers a tip jar", !!settingsBtn && !settingsBtn.hidden);
  settingsBtn.click();
  await sleep(380);
  record("settings opens the same jar", visible());
  await close();

  // 3. the help dialog
  doc.querySelector("#open-help-top").click();
  await sleep(400);
  const helpTip = [...doc.querySelectorAll("#modal button, #modal a")].find((b) => /tip jar/i.test(b.textContent || ""));
  record("the help dialog always offers a tip jar", !!helpTip);
  record("and it is a link to the page too",
    !!helpTip && helpTip.tagName === "A" && /donate\.html$/.test(helpTip.getAttribute("href") || ""),
    helpTip ? helpTip.tagName + " " + (helpTip.getAttribute("href") || "") : "missing");

  helpTip.click();
  await sleep(80);
  record("the help dialog hands the screen to the jar at once",
    visible() && doc.querySelector("#modal").hidden,
    "jar=" + visible() + " modal=" + !doc.querySelector("#modal").hidden);

  // 4. on a phone the jar leaves on a sheet's exit, not on the dropdown's:
  //    hiding it at 140ms cut the slide in half
  doc.body.click();
  await sleep(150);
  record("the sheet is still leaving halfway through its exit", !pop.hidden);
  await sleep(220);
  record("and it is gone once the exit finishes", pop.hidden);

  window.__results = { total: results.length, failures, results };
}

main().catch((e) => {
  record("harness crashed", false, String(e));
  window.__results = { total: results.length, failures, results };
});
</script>
<script>
if (location.search.indexOf("report") >= 0) {
  const started = Date.now();
  const timer = setInterval(() => {
    if (window.__results) {
      clearInterval(timer);
      fetch("http://127.0.0.1:4320/report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({ page: location.pathname, ms: Date.now() - started }, window.__results))
      }).catch(() => {});
    } else if (Date.now() - started > 60000) clearInterval(timer);
  }, 400);
}
</script>
</body>
</html>
