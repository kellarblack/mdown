<script>
(() => {
  const $ = (sel) => document.querySelector(sel);
  const rowsEl = $("#status-rows");
  const card = $("#status-card");
  const titleEl = $("#status-title");
  const noteEl = $("#status-note");
  const stampEl = $("#status-stamp");

  const HISTORY_KEY = "mdown.uptime";
  const HISTORY_MAX = 480;
  const CALM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let last = null;
  let shownPct = null;
  let shownMs = null;

  /* ---- smooth numbers: tick instead of jump ---------------------------- */
  function tween(target, from, to, format) {
    if (CALM || from === to || !Number.isFinite(from)) {
      target.textContent = format(to);
      return;
    }
    const start = performance.now();
    const duration = 420;
    const step = (now) => {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      target.textContent = format(from + (to - from) * eased);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* ---- rows that update in place instead of being rebuilt -------------- */
  const rowCache = new Map();
  const touched = new Set();

  function setRow(label, value, tone) {
    touched.add(label);
    let entry = rowCache.get(label);
    if (!entry) {
      const wrap = document.createElement("div");
      const dt = document.createElement("dt");
      const dd = document.createElement("dd");
      dt.textContent = label;
      wrap.appendChild(dt);
      wrap.appendChild(dd);
      rowsEl.appendChild(wrap);
      entry = { dd };
      rowCache.set(label, entry);
    }
    const next = String(value);
    if (entry.dd.textContent !== next) {
      entry.dd.textContent = next;
      if (!CALM) {
        entry.dd.animate(
          [{ opacity: 0.35 }, { opacity: 1 }],
          { duration: 220, easing: "ease-out" }
        );
      }
    }
    if (tone) entry.dd.dataset.tone = tone;
    else entry.dd.removeAttribute("data-tone");
    return entry.dd;
  }

  function pruneRows() {
    for (const [label, entry] of rowCache) {
      if (touched.has(label)) continue;
      const wrap = entry.dd.parentElement;
      if (CALM) { wrap.remove(); }
      else {
        const anim = wrap.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, easing: "ease-in" });
        anim.onfinish = () => wrap.remove();
      }
      rowCache.delete(label);
    }
    touched.clear();
  }

  /* ---- history ---------------------------------------------------------- */
  function readHistory() {
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed.filter((x) => x && typeof x.ok === "boolean") : [];
    } catch (e) {
      return [];
    }
  }

  function pushHistory(ok) {
    const history = readHistory();
    history.push({ t: Date.now(), ok: ok });
    while (history.length > HISTORY_MAX) history.shift();
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
    return history;
  }

  function renderHistory(history, added) {
    const wrap = $("#uptime");
    const strip = $("#uptime-strip");
    if (serverGraph) return;
    if (!history.length) { wrap.hidden = true; return; }
    wrap.hidden = false;

    const ok = history.filter((x) => x.ok).length;
    const pct = Math.round((ok / history.length) * 1000) / 10;
    const pctEl = $("#uptime-pct");
    tween(pctEl, shownPct === null ? pct : shownPct, pct, (v) => v.toFixed(1) + "% up");
    shownPct = pct;

    $("#uptime-meta").textContent =
      "· " + history.length + " check" + (history.length === 1 ? "" : "s") +
      " recorded while this page was open";

    const recent = history.slice(-60);
    strip.innerHTML = "";
    recent.forEach((entry, i) => {
      const bar = document.createElement("span");
      bar.className = "uptime-bar";
      bar.dataset.ok = entry.ok ? "true" : "false";
      bar.dataset.live = i === recent.length - 1 ? "true" : "false";
      const when = new Date(entry.t);
      bar.title = when.toLocaleTimeString() + " · " + (entry.ok ? "answered" : "unreachable");
      /* only the sample that just landed gets the rise */
      if (i === recent.length - 1 && !CALM) {
        bar.animate(
          [{ transform: "scaleY(0.18)", opacity: 0 }, { transform: "scaleY(1)", opacity: 1 }],
          { duration: 300, easing: "cubic-bezier(.22,.8,.3,1)", fill: "both" }
        );
      }
      strip.appendChild(bar);
    });
  }

  /* ---- state ------------------------------------------------------------ */
  /* same default the downloader ships with: a visitor who has never opened
     Settings still gets a status page that reports the real API */
  const DEFAULT_INSTANCE = "https://api.mdown.cc";

  function apiBase() {
    try {
      const raw = localStorage.getItem("mdown.settings");
      const parsed = raw ? JSON.parse(raw) : null;
      const stored = parsed && parsed.instance ? String(parsed.instance).trim() : "";
      const value = (stored || DEFAULT_INSTANCE).replace(/\/+$/, "");
      card.dataset.api = value;
      return value;
    } catch (e) {
      return "";
    }
  }

  function setState(state, title, note) {
    if (card.dataset.state !== state) card.dataset.state = state;
    if (titleEl.textContent !== title) titleEl.textContent = title;
    noteEl.textContent = note || "";
    noteEl.hidden = !note;
    const cta = $("#status-cta");
    if (cta) cta.hidden = state !== "no-instance";
  }

  function stamp() {
    stampEl.textContent = "checked " + new Date().toLocaleTimeString();
  }

  /* The server keeps one sample a minute in daily buckets; this is the real
     number, not one browser's memory of its own checks. The graph is drawn
     once and then updated in place: re-animating thirty bars every thirty
     seconds made a healthy server look like it was flapping. */
  let uptimeDays = "";
  let uptimeAsked = 0;
  let liveTimer = null;

  function uptimeFill(day) {
    if (!day.total) return 0.16;
    return Math.max(0.22, Math.min(1, day.up / day.total));
  }

  function uptimeState(day) {
    if (!day.total) return "unknown";
    const pct = day.up / day.total;
    if (pct >= 0.995) return "true";
    if (pct >= 0.97) return "partial";
    return "false";
  }

  const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
  function shortDate(iso) {
    const parts = String(iso || "").split("-");
    if (parts.length !== 3) return String(iso || "");
    return Number(parts[2]) + " " + (MONTHS[Number(parts[1]) - 1] || "");
  }

  function uptimeTitle(day) {
    if (!day.total) return shortDate(day.date) + " · not measured";
    const pct = Math.round((day.up / day.total) * 1000) / 10;
    return day.date + " · " + pct + "% of " + day.total + " checks";
  }

  /* once the server's graph is on screen, the browser's own 40-minute memory
     must not wipe it and replay the intro every thirty seconds */
  let serverGraph = false;

  function noteCheck(ok) {
    /* the visit is recorded for the local log, but the strip is the server's:
       drawing it from clicks is what made it look like it filled on demand */
    pushHistory(ok);
  }

  function drawUptimeBars(days) {
    const strip = $("#uptime-strip");
    const animate = strip.children.length !== days.length;
    days.forEach((day, i) => {
      let bar = strip.children[i];
      if (!bar) {
        bar = document.createElement("span");
        bar.className = "uptime-bar";
        strip.appendChild(bar);
      }
      const fill = uptimeFill(day);
      bar.dataset.ok = uptimeState(day);
      bar.title = uptimeTitle(day);
      bar.dataset.live = i === days.length - 1 ? "true" : "false";
      bar.style.transform = "scaleY(" + fill.toFixed(4) + ")";
      if (animate && !CALM) {
        bar.animate(
          [{ transform: "scaleY(0.12)", opacity: 0 }, { transform: "scaleY(" + fill.toFixed(4) + ")", opacity: 1 }],
          { duration: 420, delay: Math.min(i, 12) * 16, easing: "cubic-bezier(.22,.8,.3,1)", fill: "both" }
        );
      }
    });
  }

  function stampLive() {
    const live = $("#uptime-live");
    const text = $("#uptime-live-text");
    if (!live || !text) return;
    if (!uptimeAsked) { live.hidden = true; return; }
    live.hidden = false;
    const age = Math.round((Date.now() - uptimeAsked) / 1000);
    text.textContent = age < 3 ? "checked just now" : age < 90 ? "checked " + age + "s ago"
      : "checked " + Math.round(age / 60) + "m ago";
    live.title = "this page asks every 30 seconds; the server takes one sample a minute";
  }

  function startLiveClock() {
    if (liveTimer) return;
    liveTimer = setInterval(stampLive, 1000);
  }

  async function renderServerUptime(base) {
    try {
      const res = await fetch(base + "/uptime", { headers: { Accept: "application/json" }, cache: "no-store" });
      if (!res.ok) return false;
      const data = await res.json();
      if (!data || !Array.isArray(data.days) || !data.days.length) return false;
      const wrap = $("#uptime");
      const strip = $("#uptime-strip");
      const signature = data.days.map((d) => d.date).join(",");
      if (signature !== uptimeDays) {
        strip.innerHTML = "";
        uptimeDays = signature;
      }
      wrap.hidden = false;
      drawUptimeBars(data.days);
      const pctEl = $("#uptime-pct");
      pctEl.textContent = data.uptime === null ? "n/a" : data.uptime.toFixed(1) + "% up";
      /* the count is the server's, not this tab's. Two things used to be
         untrue here: the average divided by the full 30-day window even when
         the log only covered a day, and "today" was the server's UTC date with
         nothing saying so. */
      const measured = data.days.filter((d) => d && d.total);
      const windowDays = measured.length;
      /* no "a day" average: the first and last days are partial, so dividing
         the total by the number of days that have data is a number nobody can
         use. The span and today's count say the same thing without lying. */
      const spanText = windowDays >= 30
        ? "over 30 days"
        : (windowDays ? "since " + shortDate(measured[0].date) : "");
      const today = data.days[data.days.length - 1];
      const todayChecks = today && today.total ? today.total.toLocaleString() : "0";
      const meta = $("#uptime-meta");
      meta.textContent = "· a check a minute · " + data.checks.toLocaleString() +
        " checks " + spanText +
        " · today " + todayChecks + " so far (UTC), sampled by the server";

      /* A graph that only counts its own samples cannot notice its own death:
         if the box stops, the bars simply stop growing and yesterday still
         reads 100%. The age of the newest sample is the one number that can
         tell you that, so it is printed, and it changes the tone when it is
         old. */
      const lastAt = Number(data.lastSampleAt) ? Number(data.lastSampleAt) * 1000 : 0;
      const age = lastAt ? Math.max(0, Math.round((Date.now() - lastAt) / 1000)) : 0;
      meta.removeAttribute("data-tone");
      if (lastAt) {
        if (age > 600) {
          meta.dataset.tone = "err";
          meta.textContent = "· no check for " + Math.round(age / 60) + " minutes. the server is not reporting. the bars below stop at the last one it did.";
        } else if (age > 180) {
          meta.dataset.tone = "warn";
          meta.textContent += " · last check " + Math.round(age / 60) + " min ago";
        } else {
          meta.textContent += " · last check " + (age < 60 ? age + "s" : Math.round(age / 60) + "m") + " ago";
        }
      }
      serverGraph = true;
      uptimeAsked = Date.now();
      stampLive();
      startLiveClock();
      return true;
    } catch (e) {
      return false;
    }
  }

  async function check() {
    const base = apiBase();
    stampEl.textContent = "";

    if (!base) {
      setState("no-instance", "no API hooked up", "Add an instance address in Settings → Server and this page fills in.");
      setRow("api", "(none)");
      pruneRows();
      last = { api: "", state: "no-instance" };
      return;
    }

    setRow("api", base);

    async function probe() {
      const started = performance.now();
      try {
        const response = await fetch(base + "/health", { headers: { Accept: "application/json" }, cache: "no-store" });
        const body = await response.json().catch(() => null);
        return { response, body, ms: Math.round(performance.now() - started) };
      } catch (error) {
        return { error, ms: Math.round(performance.now() - started) };
      }
    }

    let result = await probe();
    if (result.error) {
      /* a deploy restarts the service for a second; one retry keeps that out
         of the graph as an outage */
      await new Promise((resolve) => setTimeout(resolve, 1200));
      result = await probe();
    }

    if (result.error) {
      const ms = result.ms;
      setState("down", "mdown is not answering", "The API never answered. Nothing on this page can fix that. the API did not answer. the page is static; there is nothing here to fix it.");
      setRow("error", String(result.error && result.error.message ? result.error.message : result.error), "err");
      const dd = setRow("latency", ms + " ms", "warn");
      tween(dd, shownMs === null ? ms : shownMs, ms, (v) => Math.round(v) + " ms");
      shownMs = ms;
      pruneRows();
      last = { api: base, state: "unreachable", error: String(result.error), ms };
      stamp();
      noteCheck(false);
      /* a failed probe says nothing about yesterday: the server's own 30-day
         log is still the better graph, so ask for it anyway */
      renderServerUptime(base);
      return;
    }

    const response = result.response;
    const body = result.body;
    const ms = result.ms;
    const checks = (body && body.checks && typeof body.checks === "object") ? body.checks : null;
    const checkKeys = checks ? Object.keys(checks) : [];
    const failing = checkKeys.filter((key) => !checks[key]);
    const limited = response.status === 429;
    // a 429 is the server answering: proof of life, not an outage
    const healthy = limited || (response.ok && failing.length === 0 && (!body || body.status !== "degraded"));

    setState(
      healthy ? "up" : "degraded",
      limited ? "mdown is up" : (healthy ? "mdown is up" : "mdown is limping"),
      limited
        ? "This address has asked a lot in the last minute, so the server answered with a rate limit instead of a health report. That is the server being alive, not down."
        : healthy
        ? (checkKeys.length ? "" : "This API does not report dependency checks, so this is the instance answering, not proof that downloads work.")
        : "The API answered, but " + (failing.length ? failing.join(", ") + " " + (failing.length === 1 ? "is" : "are") + " failing" : "it reports itself as degraded") + ". Downloads may still work; merges and conversions may not."
    );

    setRow("status", "HTTP " + response.status);
    const latency = setRow("latency", ms + " ms");
    tween(latency, shownMs === null ? ms : shownMs, ms, (v) => Math.round(v) + " ms");
    shownMs = ms;

    if (checkKeys.length) {
      setRow("downloader", checks.downloader ? "ok" : "failing", checks.downloader ? "ok" : "err");
      setRow("ffmpeg", checks.ffmpeg ? "ok" : "failing", checks.ffmpeg ? "ok" : "err");
      setRow("ffprobe", checks.ffprobe ? "ok" : "failing", checks.ffprobe ? "ok" : "err");
      setRow("storage", checks.storage ? "ok" : "low disk", checks.storage ? "ok" : "err");
    }
    const jobs = body && body.jobs;
    if (jobs && jobs.active !== undefined) {
      setRow("jobs", (jobs.active || 0) + " active · " + (jobs.queued || 0) + " queued");
    }
    if (body && typeof body.uptimeSeconds === "number") {
      setRow("uptime", Math.floor(body.uptimeSeconds / 3600) + " h");
    }
    if (body && body.cobalt && body.cobalt.version) {
      setRow("version", body.cobalt.version);
    }

    /* the process being up and the sites still parsing are different things.
       the canary is the second one, and it is the one that predicts whether a
       pasted link will work. */
    if (body && typeof body.ytdlp === "string" && body.ytdlp) {
      setRow("extractor", "yt-dlp " + body.ytdlp);
    }
    const canary = body && body.extraction;
    if (canary && canary.of > 0 && canary.at > 0) {
      const hours = Math.max(0, Math.round((Date.now() / 1000 - canary.at) / 3600));
      const okay = canary.of - canary.failed;
      const ago = hours < 1 ? "just now" : hours + "h ago";
      if (canary.failed >= 2) {
        setRow("sites", okay + " of " + canary.of + " · " + (canary.services || "some") + " failing", "err");
      } else {
        setRow("sites", okay + " of " + canary.of + " parse · " + ago);
      }
    }

    pruneRows();
    last = { api: base, state: healthy ? "up" : "degraded", status: response.status, ms, checks, body };
    stamp();
    noteCheck(healthy);
    renderServerUptime(base);
  }

  function statusText() {
    const lines = [
      "mdown status report",
      "time: " + new Date().toISOString(),
      "page: " + location.href,
      "api: " + (last && last.api ? last.api : "(none configured)"),
      "state: " + (last ? last.state : "unknown"),
      "browser: " + navigator.userAgent
    ];
    if (last && last.status) lines.push("http: " + last.status + " in " + last.ms + " ms");
    if (last && last.checks) lines.push("checks: " + JSON.stringify(last.checks));
    if (last && last.error) lines.push("error: " + last.error);
    return lines.join("\n");
  }

  async function copyText(text, message) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        toast(message || "copied");
        return true;
      }
    } catch (e) { /* fall through: Safari says no when the page is not focused */ }
    const area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.top = "0";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    let copied = false;
    try { copied = document.execCommand("copy"); } catch (e) { copied = false; }
    area.remove();
    if (copied) { toast(message || "copied"); return true; }
    /* last resort that still helps: show the text, already selected, so one
       long-press or ⌘C finishes it. Nothing here can fail silently. */
    let out = document.getElementById("status-copy-out");
    if (!out) {
      out = document.createElement("pre");
      out.id = "status-copy-out";
      out.className = "status-copy-out";
      document.querySelector(".status-actions").after(out);
    }
    out.textContent = text;
    out.hidden = false;
    const range = document.createRange();
    range.selectNodeContents(out);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    toast("select and copy, or use the text below", "warn");
    return false;
  }

  function toast(message, tone) {
    const host = $("#toasts");
    if (!host) return;
    const node = document.createElement("div");
    node.className = "toast";
    node.dataset.tone = tone || "ok";
    node.textContent = message;
    host.appendChild(node);
    setTimeout(() => {
      node.classList.add("is-leaving");
      setTimeout(() => node.remove(), 200);
    }, 4000);
  }

  $("#status-refresh").addEventListener("click", check);
  /* copying always works, offline or rate-limited; a POST does not */
  $("#status-copy").addEventListener("click", () => copyText(statusText(), "status copied"));
  check();

  /* polling a hidden tab is wasted requests; resume the moment it is visible */
  let timer = null;
  function startPolling() {
    if (timer) return;
    timer = setInterval(check, 30000);
  }
  function stopPolling() {
    if (!timer) return;
    clearInterval(timer);
    timer = null;
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopPolling();
    else { check(); startPolling(); }
  });
  startPolling();
})();
</script>

</body>
</html>
