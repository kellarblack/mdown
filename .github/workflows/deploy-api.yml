# Builds the Go API (api/) and installs it on the VPS. Manual for now.
#
# This is what lets a collaborator help: they open a PR, you merge it, the box
# updates itself. Nobody has to hand out a server password.
#
# One-time setup:
#   1. On the box:  sudo git clone https://github.com/<you>/mdown.git /opt/mdown-src
#   2. Locally:     ssh-keygen -t ed25519 -f ~/.ssh/mdown_deploy -N ""
#                   ssh-copy-id -i ~/.ssh/mdown_deploy.pub root@<ip>
#   3. Repo → Settings → Secrets → Actions:
#        DEPLOY_HOST      <ip>
#        DEPLOY_USER      root
#        DEPLOY_SSH_KEY   contents of ~/.ssh/mdown_deploy  (the PRIVATE key)
#
# The key only exists in repo secrets, never in the code. Public repo, private key.

name: deploy api

on:
  # Manual on purpose: it needs three repo secrets, and until they exist every
  # push would show a red X. Turn this back to `push:` once the secrets are set.
  workflow_dispatch:

jobs:jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - name: Test and build
        working-directory: api
        run: |
          go test -count=1 ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/mdown-api ./cmd/mdown-api
      - name: Copy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "api/dist/mdown-api,api/deploy/mdown-api.service"
          target: /tmp/mdown-go
          strip_components: 1
      - name: Install and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            install -d -m 0755 /opt/mdown/bin
            install -m 0755 /tmp/mdown-go/dist/mdown-api /opt/mdown/bin/mdown-api
            install -m 0644 /tmp/mdown-go/deploy/mdown-api.service /etc/systemd/system/mdown-api.service
            systemctl daemon-reload
            systemctl restart mdown-api
            sleep 2
            curl -fsS http://127.0.0.1:9000/health || (journalctl -u mdown-api -n 30 --no-pager; exit 1)
