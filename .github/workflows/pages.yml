# Publishes the static site to GitHub Pages on every push to main.
#
# One-time setup in the repo:
#   Settings → Pages → Source: GitHub Actions
#   Settings → Pages → Custom domain: mdown.cc  (adds a CNAME)
#
# This ships the front-end only. The API in `server/` runs on a VPS and is
# deployed with `server/deploy/deploy-to.sh` — it is never published here.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          # everything the browser needs, and nothing else
          cp index.html 404.html terms.html status.html _site/
          cp robots.txt sitemap.xml llms.txt manifest.webmanifest _headers _site/
          cp -r assets _site/
          # the API, tests and dev shots are not part of the published site
          rm -rf _site/assets/vendor/ffmpeg/.DS_Store

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
