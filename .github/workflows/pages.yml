# Builds web/ and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repo:
#   Settings → Pages → Source: GitHub Actions
#   Settings → Pages → Custom domain: mdown.cc  (adds a CNAME)
#
# This ships the front-end only. The API in `server/` runs on a VPS and is
# deployed with `server/deploy/deploy-to.sh` — it is never published here.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Build the site (React + TypeScript, bundled by Bun)
        run: |
          cd web
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          mv dist ../_site

      - name: Privacy check
        run: python3 tests/privacy_check.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
