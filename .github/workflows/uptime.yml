# External uptime check: a free pager that needs no third-party account.
#
# Every 30 minutes this asks the API how it is. If it is not 200, it opens an
# issue — GitHub emails repo watchers, which is the alert. When the API comes
# back it comments and closes the issue, so the tracker is the history.
#
# Note: GitHub disables scheduled workflows after 60 days without repo activity.
# Any push re-enables them.

name: uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: ask the api how it is
        id: probe
        run: |
          set +e
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 https://api.mdown.cc/health 2>/tmp/curl.err)
          [ -n "$code" ] || code=000
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "body<<HEALTH_EOF"
            head -c 600 /tmp/health.json 2>/dev/null
            head -c 300 /tmp/curl.err 2>/dev/null
            echo
            echo "HEALTH_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "probe returned $code"

      - name: open an issue when it is down
        if: steps.probe.outputs.code != '200'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                   --search 'api down in:title' --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "already tracking an outage ($open open) — not opening another"
            exit 0
          fi
          body=$(cat <<EOF
          \`https://api.mdown.cc/health\` returned **${{ steps.probe.outputs.code }}** at $(date -u +%Y-%m-%dT%H:%MZ).

          \`\`\`
          ${{ steps.probe.outputs.body }}
          \`\`\`

          What to check, in order:

          1. \`ssh -i ~/.ssh/mdown root@136.0.57.157 'systemctl status mdown-api'\`
          2. \`journalctl -u mdown-api -n 50 --no-pager\`
          3. \`journalctl -t mdown-health -n 20 --no-pager\` — the local watchdog logs restarts here
          4. \`curl -s https://api.mdown.cc/health\` from the box, then from outside

          The box restarts the API itself when \`/health\` fails, at most once every ten
          minutes. If this issue is open, that did not work.
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "api down: $(date -u +%Y-%m-%dT%H:%MZ)" \
            --body "$body"

      - name: close the issue when it recovers
        if: steps.probe.outputs.code == '200'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          numbers=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                      --search 'api down in:title' --json number --jq '.[].number')
          for n in $numbers; do
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" \
              --body "Back to 200 at $(date -u +%Y-%m-%dT%H:%MZ)."
            gh issue close "$n" --repo "$GITHUB_REPOSITORY"
          done
